# shared_writes.toml — THE FROZEN SHARED-SURFACE WRITE INVENTORY (14z-79)
#
# ***********************************************************************
# ** STALE AS OF 14z-127 (2026-09-02) — THIS INVENTORY PINS THE 14z-91  **
# ** BUILDS (don_m7 / hui41 / pyron26) AND HAS NOT SEEN A CURRENT BUILD **
# ** IN TEN FREEZES. `tests/test_shared_writes.sh` IS GREEN AGAINST     **
# ** THOSE PINNED DIRS, NOT AGAINST WHAT SHIPS.                         **
# ** Audited against the 14z-127 builds: donovan 108 writes vs 90 frozen **
# ** (18 NEW), huitzil 106 vs 87 (19 NEW), pyron 94 vs 76 (18 NEW).      **
# ** Only 3 per tenant are 14z-127's (the boot_title_saved_* rows); the  **
# ** other ~15 are shipped work from m8..m14 that NOBODY WAS EVER FORCED **
# ** TO REVIEW -- e.g. 0x020B9C (the Oboro select hook, 14z-105),        **
# ** 0x020C74/0x020C80 (random select, 14z-117), 0x0BE27A..0x0BE296      **
# ** (eight poke32, the #99 AI-script unpark, 14z-111).                  **
# ** DO NOT SIMPLY RE-POINT AND RE-FREEZE: that would launder an         **
# ** unreviewed inventory into the gate that exists to review it         **
# ** ([VSP-97]). The work is to establish WHOSE bytes each new write     **
# ** lands on and record the `why`, then re-point. Handed to the         **
# ** emulator-tier arc (maintainer, 2026-09-02: "as long as we hand the  **
# ** audit to tonight's arc I don't mind freezing now: after all frozen  **
# ** is not released").                                                  **
# ***********************************************************************
#
# Every build op that lands OUTSIDE declared free space and OUTSIDE a known
# variant row (0x10-0x1F of a bank_map per-character table) is listed here,
# per tenant. `tests/test_shared_writes.sh` fails on any addition, removal or
# change.
#
# WHY THIS EXISTS. `tests/test_hui_ladder.sh` already requires every op to
# write free space or a variant row — but it runs stages 1-3, and the row that
# broke Bulleta was stage 4:
#
#     data_port df_palette_seq_rows -> vsavj 0x39ACC0, 0x80 bytes
#
# Those are palette-seq ids 0x1E-0x21, BULLETA'S Dark Force block. It shipped
# in 14z-69 and rendered a LEGACY character wrong for ten sessions, invisible
# to every RAM gate because the palette path never transits work RAM. Nothing
# failed, because the invariant that names that class stopped one stage short.
# `tools/audit_shared_writes.py` flags exactly that write on build/hui27 —
# the instrument's positive control.
#
# WHAT A GREEN RUN MEANS, precisely: the set of writes onto vanilla-readable
# bytes is UNCHANGED since it was last reviewed. It does NOT mean the writes
# are safe. An entry frozen without checking whose bytes it lands on stays
# wrong and green — which is what would have happened to the DF row. When this
# gate fails, the work is to establish WHOSE bytes the new write touches, not
# to re-freeze until it passes.
#
# THE CLASSES currently present (all three tenants):
#   * `site_thunk` engine sites — 6 bytes of `jmp`/`jsr` at a hooked engine
#     address. Justified per row in the manifest that declares them.
#   * select-wheel roster21: TABLE B cursor-navigation rows (3 new rows + 5
#     inbound edges from existing cells — required for the appended cells to
#     be reachable) and two march mid-row retargets. Gated by
#     `tests/test_select_wheel.sh`, which walks all 128 (cell,direction) pairs
#     in MAME.
#   * select record-array rows (0x2672xx/0x2675xx/0x268xxx) — the tenant's own
#     rows of 32-row arrays that bank_map does not declare, so the variant-row
#     check cannot see them. Gated by `tests/test_select_arrays.sh`.
#   * palette pointer-table variant halves (0x38c1d8 / 0x38c258) — row 0x10/
#     0x11 of the 32-row sprite/effect palette pointer tables. Gated by
#     `tests/test_effect_palette_table.sh`.
#   * `data_port` pointer-table rows (e.g. 0xbe2ba row 0x10) — a variant row of
#     a table bank_map does not declare.
#   * `code_word` / `obj_hook` engine words, each justified in its manifest row.
#
# Regenerate a tenant's list after a REVIEWED change:
#   python3 tools/audit_shared_writes.py build/<dir> | tail -n +2

