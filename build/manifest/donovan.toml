# The ported x026142 blob carries a COPY of the per-char OBJ bank table
# (vs2 0x27530, read PC-relative by the ported setter 0x2751C and helper
# 0x27524). Two defects at stage <=5: the region len (0x1400, bounded by
# genuine vh2 sibling divergence in the table rows) TRUNCATES the table
# at row 9 — the x088512 effect caller (d0=0x0A) reads past the ported
# end (garbage bank word); and the in-blob rows hold VS2 values, wrong
# on vsavj (row 0x0F = 0x0000 = bank 0 — the current sprite garble).
# Fix: pad the region to cover all 0x18 rows and rewrite the WHOLE
# table with the VANILLA vsavj values (PRG:0x282D4, opcode space, row
# 0x0F = 0x4000 = bank 2) — the table semantically answers "bank of
# char N in THIS game's gfx". Provenance GEN (values below are the
# vsavj table verbatim; rows 0x10-0x17 mirror 0x00-0x07, dark forms).
[table_fix]
stage = 6
region = "x026142"
pad_len = 0x1440
table_off = 0x13EE
rows_hex = "600060000000200060000000400040000000600040006000600000000000400060006000000020006000000040004000"
note = "ported per-char OBJ bank table -> vanilla vsavj values (0x282D4)"

# (record + coordinate-list pointers are validated against PLACED
# addresses at generation time — the pass runs after ref relocation)
[gfx_remap]
stage = 6
region = "anim"
band_lo = 0x863F
band_hi = 0xC2EF
delta = 0x2750
# Non-band codes in MIXED records (shared-effect art drawn by the main
# bank-2 objects — the residual-blink class, playtest round 5) are
# shelf-packed into the tail of Jedah's band freed by the main-band
# placement. The x2b7ef4 companion-effect records need NO remap: their
# objects run bank 1 (#$2000 setter) against the engine effect page
# that sits at the SAME absolute indices in vsav (1,070/1,455 tiles
# byte-identical in place — measured session 14b).
eff_lo = 0xEA40
eff_hi = 0xEEBB

# ── M2b sprite palette (session 14; stage 6). The per-char palette
# pointer table (vsavj 0x38C198 / vs2 0x396B94, long per char, indexed
# by the pre-scaled runtime char id; uploader vsavj 0x1C3FE copies 12
# rows to palette RAM 0x90C140) was never repointed — Donovan rendered
# with Jedah's colors (playtest round 4). Port the whole 0x500-byte
# block (all confirm-button variants) and repoint row 0x0F. Portrait/
# select-art palette tables (vsavj 0x3B5988/0x3BAEA8 family) ride with
# the portrait work, not here.
[palette]
stage = 6
src = 0x39CB9C
len = 0x500
src_head_hex = "00000FFF0EB80D97"
table = 0x38C198
row = 0x0F

