# donovan.toml — port configuration for the donovan-m2 patch
# (consumed by tools/gen_donovan_patch.py; see docs/patch_index.md)

[port]
src_set = "vsav2"
src_char = 0x13
dst_slot = 0x0F
# every bank repoint patches BOTH 0x0F and its aliasing variant row 0x1F
# (vsavj variant half aliases base except slot 8) — asserted vanilla-equal
mirror_variant = true

# free-space holes (verified 0xFF fill, tools/extract free-space scan)
[hole_a]
start = 0x0BF6A0
end = 0x100000

[hole_b]
start = 0x3EC720
end = 0x400000

# Secondary-object (projectile) dispatch hook (stage 4+): vsavj's local
# type table has 58 entries; vsav2's has 76 — the extras are the newcomers'
# sub-object handlers, and Donovan spawns type 60. The generator builds an
# extended table in free space (entries 0..57 byte-identical to vanilla,
# 58..75 = relocated ported handlers) and replaces the 8-byte engine
# sequence `movea.l (d8,PC,D0.w),A0; moveq #0,D0; jsr (A0)` with
# `jsr thunk; nop` — semantically identical for vanilla types (proved by
# the legacy bit-identity gate).
# (two of the seven type-dispatch sites need extension; the other five have
# equal-sized tables in both games — verified session 4)
[[obj_hook]]
site = 0x054470
vanilla_table = 0x054484
vanilla_entries = 59
src_table = 0x05C620
src_entries = 76

[[obj_hook]]
site = 0x05E542
vanilla_table = 0x05E556
vanilla_entries = 114
src_table = 0x06A51C
src_entries = 124

# non-bank repoints (select screen, win quotes, AI, versus tables) land here
# as stage-5 RE pins their addresses down; op = poke16|poke32, both slots
# where applicable.
# [[aux_poke]]
# name = "..."
# addr = 0x0
# op = "poke32"
# val = 0x0
