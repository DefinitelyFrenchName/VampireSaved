# The ported x026142 blob carries a COPY of the per-char OBJ bank table
# (vs2 0x27530, read PC-relative by the ported setter 0x2751C and helper
# 0x27524). Two defects at stage <=5: the region len (0x1400, bounded by
# genuine vh2 sibling divergence in the table rows) TRUNCATES the table
# at row 9 — the x088512 effect caller (d0=0x0A) reads past the ported
# end (garbage bank word); and the in-blob rows hold VS2 values, wrong
# on vsavj (row 0x0F = 0x0000 = bank 0 — the current sprite garble).
# Fix: pad the region to cover all 0x18 rows and rewrite the WHOLE
# table with the VANILLA vsavj values (PRG:0x282D4, opcode space, row
# 0x0F = 0x4000 = bank 2) — the table semantically answers "bank of
# char N in THIS game's gfx". Provenance GEN (values below are the
# vsavj table verbatim; rows 0x10-0x17 mirror 0x00-0x07, dark forms).
[table_fix]
stage = 6
region = "x026142"
pad_len = 0x1440
table_off = 0x13EE
rows_hex = "600060000000200060000000400040000000600040006000600000000000400060006000000020006000000040004000"
note = "ported per-char OBJ bank table -> vanilla vsavj values (0x282D4)"

