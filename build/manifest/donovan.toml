# donovan.toml — port configuration for the donovan-m2 patch
# (consumed by tools/gen_donovan_patch.py; see docs/patch_index.md)

[port]
src_set = "vsav2"
src_char = 0x13
dst_slot = 0x0F
# every bank repoint patches BOTH 0x0F and its aliasing variant row 0x1F
# (vsavj variant half aliases base except slot 8) — asserted vanilla-equal
mirror_variant = true
alloc_wrap = "0x15702,0x1572e"
near_map = "x0905ae=x088512"
hole_b_regions = "aux0_4,hitbox"

# free-space holes (verified 0xFF fill, tools/extract free-space scan)
[hole_a]
start = 0x0BF6A0
end = 0x100000

[hole_b]
start = 0x3EC720
end = 0x400000

# Secondary-object (projectile) dispatch hook (stage 4+): vsavj's local
# type table has 58 entries; vsav2's has 76 — the extras are the newcomers'
# sub-object handlers, and Donovan spawns type 60. The generator builds an
# extended table in free space (entries 0..57 byte-identical to vanilla,
# 58..75 = relocated ported handlers) and replaces the 8-byte engine
# sequence `movea.l (d8,PC,D0.w),A0; moveq #0,D0; jsr (A0)` with
# `jsr thunk; nop` — semantically identical for vanilla types (proved by
# the legacy bit-identity gate).
# Targeted byte patches on ported regions (applied to the fixed blob after
# relocation; old bytes verified). The companion (Anita) registers itself in
# object-update class 7 — a queue class that exists only in vsav2 (its
# subcategory jump table has 8 cases, vsavj's has 7; heads $FFF992+4K,
# counts $FFF9C9+K). Remap her to vsavj's last class (6, subcat 0xC):
# update/draw order shifts to the end of class processing — a deliberate
# M2a approximation recorded in docs/tables/reconciliation.md.
[[port_patch]]
region = "x088512"
src_addr = 0x08B0F8
old_hex = "000e"
new_hex = "000c"
note = "companion queue class 7 (vs2-only) -> vsavj class 6"

# +0x14E engine state-dispatch extension (session 8-9, reconciliation.md
# "Session 8"): vsavj's brief-word dispatch (site 0x2A7C8, table 0x2A7E2)
# has 89 entries; vsav2's twin (0x29B50/0x29B6C) has 101 — 12 newcomer
# states (Donovan's VS2 QCB+K writes 0xB6 = idx 91). The vs2 case stubs are
# UNIFORM (cmp.b prev; beq ret; clr flags; move.w #seq_id,D0; moveq #1,D1;
# bra seq_set) so they are SYNTHESIZED against vsavj equivalents (ret =
# 0x2A7E0 rts, seq_set = 0x2AD94 — both structurally verified twins).
# Their seq ids 0x2CD-0x2D8 index the global 32B-stride palette-sequence
# table (vsavj base 0x39A900), ALSO shorter in vsavj: the 12 records
# (vs2 0x3B63DC, byte-identical in vhunt2 @0x3963B0) are placed in a hole
# and the 4 consumer sites get ghost-clean base-swap thunks (movea.l #base
# is exactly 6 bytes = jmp thunk; no pushes; CCR safe — andi.w follows).
[state_hook]
site = 0x02A7C8
site_resume = 0x02A7CE
site_after = 0x02A7D6
state_off = 0x14E
first_ext = 0xB2
n_ext = 12
ret_equiv = 0x02A7E0
seq_set = 0x02AD94
prev_state_off = 0x14F
clr_b_off = 0x181
clr_w_off = 0x182
seq_first_id = 0x2CD
seq_base = 0x39A900
seq_consumers = "0x02AD82,0x02AD94,0x02B342,0x02B7E8"
records_src = 0x3B63DC
records_orc = 0x3963B0
records_len = 0x180

# Hit-reaction dispatch extension (session 11, playtest DP-spam crash):
# the defender-side reaction dispatch (vsavj site 0x18460
# `move.w (6,PC,D0.w),D1; jmp (2,PC,D1.w)`, table 0x18468, real extent
# ~81 ids; vsav2 twin 0x16D2C/0x16D34) is EXTENDED in vs2 by three
# reaction ids 0xA2/0xA4/0xA6 — Donovan's ES DP inflicts 0xA2 (measured:
# 19_don_dp_spam crashes vec4 at 0x18498 = garbage decode past the
# vanilla table). The vs2 cases are position-independent one-liners on
# A1 (defender) / A3 (attack record), synthesized verbatim:
#   0xA2 @0x16F70: move.b $17(a3),$54(a1); rts
#   0xA4 @0x16FEC: move.b #$52,$54(a1); rts
#   0xA6 @0x16F78: clr.b $121(a1); move.b #1,$54(a1); rts
# Ghost-clean topology: the PRECEDING `tst.b ($38,A1); bne $18508` pair
# (8 bytes at 0x18458) becomes `jmp thunk`; the thunk re-creates the
# tst/branch, range-checks D0, dispatches extended ids via a long table
# (jmp, not jsr — cases rts to the dispatch's caller), and vanilla ids
# jmp back to the UNTOUCHED original dispatch at 0x18460.
[reaction_hook]
site_prefix = 0x018458
site_prefix_expect = "4a290038660000aa"
tst_disp = 0x38
bne_target = 0x018508
dispatch = 0x018460
first_ext = 0xA2
n_ext = 3
case_a2 = "136b001700544e75"
case_a4 = "137c005200544e75"
case_a6 = "42290121137c000100544e75"

# Pool-seeding init shim (stage 4+): vanilla vsav never seeds the
# secondary-object pools during a normal match, vsav2 always does (its
# system objects need them) — and Donovan's ecosystem (companion, effects)
# allocates from them. dispatch_00[0x0F] is routed through a synthesized
# shim: if the pool-0 free-list head (A5+0x7966) is still zero (never
# seeded this match), call vsavj's own seeder aggregator entry B
# (0x016C64 — the direct analog of what vsav2's match flow calls), then
# fall into his relocated init handler. Idempotent via the head latch;
# invisible to every other character.
[init_shim]
dispatch = "dispatch_00"
seed_entry = 0x016C64
latch_disp = 0x7966
# VS2/VH2 flavor latch (docs/atlas/character_tables.md "Start-hold flavor"):
# player-struct byte +0x3C2, read by Donovan's QCB+K handler + projectile.
# vsavj never writes it; the shim seeds the source game's default, and
# (stage 5) holding YOUR Start through match load selects the other
# flavor — the community-confirmed protocol. flavor_hold_flag is the
# per-player Start bitmask byte (bit 0 = P1, bit 1 = P2; measured live
# through char-init, sessions 10-11).
# 0x01 = VS2 flavor (maintainer decision 2026-07-27), 0x00 = VH2.
flavor_disp = 0x3C2
flavor_default = 0x01
flavor_held = 0x00
flavor_hold_flag = 0xFF8060

# (two of the seven type-dispatch sites need extension; the other five have
# equal-sized tables in both games — verified session 4)
[[obj_hook]]
site = 0x054470
vanilla_table = 0x054484
vanilla_entries = 59
src_table = 0x05C620
src_entries = 76

[[obj_hook]]
site = 0x05E542
vanilla_table = 0x05E556
vanilla_entries = 114
src_table = 0x06A51C
src_entries = 124

# non-bank repoints (select screen, win quotes, AI, versus tables) land here
# as stage-5 RE pins their addresses down; op = poke16|poke32, both slots
# where applicable. Session 11 findings: pick/select behavior already works
# via the bank repoints (anim hover, +0x382 id path); portrait/name are
# GFX (M2b, placeholder-acceptable per the M2a bar); the attract's CPU
# demo on slot 0x0F runs crash-free (legacy gate, every build).
# [[aux_poke]]
# name = "..."
# addr = 0x0
# op = "poke32"
# val = 0x0

# Anita's ALTERNATE anim table (companion tail branch `tst.b $3(a6); bne ->
# movea.l #$36784A`, taken only when the spawn-record sub byte != 0 —
# Donovan's hook always writes sub=0, branch proven unreached through the
# full moveset + oracle batteries). The table is deliberately unported;
# poison the operand so any future writer faults loudly at a named block.
[[imm_poison]]
region = "x088512"
src_addr = 0x08A300
old_imm = 0x0036784A
note = "Anita alternate anim table (sub!=0 branch; unreached — port or map when a writer appears)"

# Layout groups: regions that PC-reference each other (directly or via
# word jump tables) keep their source-relative spacing; the inter-region
# gaps are recycled for small allocations. (Session 5: a handler's
# jsr (d8,PC,D1.w) into the support zone landed mid-region after repacking.)
[[layout_group]]
regions = "code,x05c800,x065952,x065c22,x065e5a,x066ec4"

[[layout_group]]
regions = "x026142,x028122"
