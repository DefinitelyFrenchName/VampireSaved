# 14z-26: HIT-CLASS PROPERTY TABLE EXTENSION (round-39 report: Change
# Immortal 421P killing blow leaves the victim standing in neutral at
# match end — no SPECIAL FINISH death). Mechanism (measured end to
# end): the reaction dispatch (0x2380C family) indexes the per-hit-
# class property table at 0x28D00 with the victim's +0x54 class byte;
# vs2 EXTENDED the table with classes 0x4E-0x53 for the new
# characters' moves (the deity's hits carry class 0x4E -> property
# 0x0F routes the electrocute/special-finish reaction — measured on
# native: the victim shakes in the lightning X-ray, hence the SPECIAL
# FINISH banner). vsavj's table is ZERO there (spare zero-filled
# capacity, terminator at +0x5F untouched), so the special branch
# never fires and the victim's hitstun expires into idle. In-place
# 6-byte port; legacy-safe by construction: no vanilla attack emits
# classes > 0x49 (the entries are dead until ported attack data
# references them). Likely also fixes reaction quirks on OTHER ported
# moves using the new classes.
# 14z-28 (round-41 REVERT): the 14z-27 class remap (0x4E -> 0x04)
# broke the MOVE ITSELF — class 0x04 carries knockdown-on-hit
# semantics; Change Immortal is a standing up-to-8-hit multi. The
# class byte feeds THREE consumers (on-hit reaction property, the
# death path re-read, per-victim aura effect-row) and no native class
# satisfies all three. Interim state = round-38 behavior: class 0x4E
# with property 0 (plain hitstun on hit — the move plays correctly;
# the match-end neutral-pose cosmetic returns, accepted until the
# per-consumer extension lands — full map in STATE 14z-28). Only
# classes 0x50-0x53 stay ported (future-proofing, currently
# unreferenced by any attack).
[[data_port]]
stage = 6
name = "hit_class_props_ext_hi"
src = 0x028028
len = 0x4
