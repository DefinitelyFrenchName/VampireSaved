# ── 14z-52 M5: Donovan's per-char QSound record array ─────────────────────
# The walker's per-node sfx path (ported dispatcher, built at ~0xCE3B8)
# reads `lea 0xBF41A,a0; movea.l (a0,charid*4),a0; move.w (a0,idx*8),d1`
# and calls the sound helper. Slot 0x0F's row still pointed at JEDAH's
# array, whose live length is ~40 entries — while Donovan's scripts index
# up to 43 (measured, replays 12/25/56). Unstubbing the helper without
# this row would read PAST Jedah's array into neighbouring data (random
# ids, including the 0x7xx music range). So: port Donovan's own 44-entry
# array, hole-allocated, and repoint row 0x0F.
#
# keep_ids = the ONLY ids of his table whose sample exists on vsavj with
# identical content (QSound key-on probe, both sets, docs/m5/):
#   0x110 0x111 0x112 0x119 0x152 0x202
# Everything else in his table is either a vsavj MUSIC TRACK (0x700-0x71F,
# 0x750-0x757 — 30 ids) or a sample absent from vsav's (byte-full) sample
# ROMs (9 ids). Those are zeroed: the engine skips id==0, so they stay
# SILENT instead of playing music//the wrong sound. Restoring them needs
# ported voice samples — STATE "Decisions pending: M5 voice samples".
# BLOCKED ON ROM SPACE (14z-52): enabling this needs 0x160 bytes and BOTH
# code holes are full (a: exhausted, b: <0x160 free) — the two ls_freeze
# site_thunks lose their home if this allocates. Un-comment together with
# the sound_helper row in reconciliation.toml ONCE a data home is decided
# (candidate: Jedah's freed anim region [0x248B88,0x267000) — needs its own
# dead-space audit; it is also the earmarked home for the ported select web).
# UNBLOCKED (Phase C): the 0x160-byte array now has a home in the CPS-2 WIDE
# program extension. Profile-gated, so a stock-size build skips this row
# entirely and stays byte-identical; only --profile cps2-wide-v1 emits it.
# Enabling it for a SHIPPING build means the build requires the vsavjw driver
# and a patched emulator — a maintainer decision (STATE.md).
[[sound_table]]
stage = 6
profile = "cps2-wide-v1"
name = "don_sfx_records"
hole = "wide_ext"   # 2MB free; hole_a is full and hole_b has 0x110 left
src = 0x0CB01A
entries = 44
ptr_table = 0x0BF41A
ptr_old = 0x000B3220
keep_ids = "0x110,0x111,0x112,0x119,0x152,0x202"
# Un-stub the per-node sfx helper (vs2 0x005122 -> vsavj twin 0x004CE2, the
# address recorded in its reconciliation row). Placing it HERE and not in
# reconciliation.toml is deliberate: the helper is only safe once this
# array exists, so the two must be impossible to enable separately. A stock
# build skips this whole row and the helper stays stubbed.
unstub = "0x005122=0x004CE2"

# ── SELECT WHEEL: three appended cells (14z-60s) ────────────────────────────
# Adds Huitzil/Phobos (0x10), Pyron (0x11) and Donovan (0x13) to the
# character-select wheel. Profile-gated CONTENT: a stock build skips this
# row entirely and its fingerprint is unchanged.
#
# NOTHING IS SHIFTED. Two structures must grow and neither can grow in
# place, but both are pointer-reached with exactly ONE referrer each and no
# interior aliasing (measured, docs/atlas/select_screen.md), so the vanilla
# bytes stay where they are and two pointers change:
#   record     PRG:0x272A68  <- referenced only by PRG:0x2689FE
#   coord list PRG:0x32A50A  <- referenced only by the record's own cptr
# TABLE B needs no relocation at all: rows 0x10/0x11/0x13 already exist as
# unused alias copies, so it is a 28-byte in-place edit.
#
# The budget word is deliberately CARRIED OVER unchanged from the vanilla
# record (docs/GOTCHAS.md: the OBJ emitter debits it from a shared per-frame
# budget, and a changed budget once flipped a borderline skip decision into
# a one-byte $FF811B divergence). 85 >= 21 entries, so it still covers them.
[[select_wheel]]
stage = 6
profile = "cps2-wide-v1"
name = "roster21"
layout = "build/manifest/wheel_layout_proposed.json"
hole = "wide_ext"
table_b = 0x0211E4          # 32 rows x 8; edited IN PLACE
record = 0x272A68           # vanilla wheel record (copied, never modified)
record_ptr = 0x2689FE       # its single referrer
coord_list = 0x32A50A       # vanilla coord list (copied, never modified)
# vanilla values asserted before anything is emitted — if any of these has
# moved, the manifest is describing a ROM we are not building against.
expect_count = 17
expect_budget = 0x55
expect_cptr = 0x32A50A

# ── SELECT RECORDS at a variant id (M3a select-records half, 14z-62) ─────────
# The tenant's OWN select records: what the hovered cell displays. Emitted
# ONLY when the tenant occupies a variant-half id (>= 0x10) — at the
# substituted slot 0x0F, tools/select_port.py's in-place surgery remains the
# mechanism and this section is inert, so the frozen references rebuild
# byte-identically.
#
# Mechanism (docs/atlas/select_screen.md, measured 14z-61, gate
# tests/test_select_arrays.sh): three UI pieces each ride a 32-row x 4-byte
# record-pointer array per player (P2 array = P1 + 0x80), indexed by the
# cursor CELL/ID with NO 4-bit fold. Rows 0x10-0x1F alias 0x00-0x0F in
# vanilla, and no legacy gameplay path writes a variant-half id
# (tests/audit_id_writers.sh) — so repointing the tenant's two rows per piece
# touches nothing legacy content can reach, BY CONSTRUCTION.
#
# Per row the generator: asserts the vanilla anchors below; reads the vs2
# source records (vs2's own arrays, same 32-row/+0x80 model, row = src_char);
# remaps entry tile codes through select_port.PLACEMENTS; copies each coord
# list; allocates list+body via the space model; pokes the two vj rows.
# Composed records keep VS2'S OWN budget words — the rows are unreachable by
# legacy ids, so the budget only debits frames that draw the tenant, which
# are new-character content by definition.
#
# allow_placeholder_tiles: entries whose (tile,block) has no placement keep
# their vs2 tile codes — same interim policy the maintainer ratified for the
# wheel medallions ("imperfect medallion art is acceptable, mechanical
# soundness is not"). They render correctly once the gfx half places select
# art in WIDE group C. The portrait must NOT need placeholders (all its
# blocks have had placements since M2b) — declaring false makes a placement
# regression loud.
[[select_records]]
stage = 6
name = "portrait"
hole = "wide_ext"
allow_placeholder_tiles = false
vj_p1 = 0x26742A            # P1 array base (row 0 of 32)
vj_p2 = 0x2674AA            # = vj_p1 + 0x80
vs2_p1 = 0x2A0762           # vs2's arrays, same model (found via the known
vs2_p2 = 0x2A07E2           #   Donovan record 0x2A63F0 = row 0x13, verified
                            #   by row-shape on both halves)
expect_vs2_p1 = 0x2A63F0    # vs2 row src_char (Donovan's records)
expect_vs2_p2 = 0x2A6416
expect_vj_alias_p1 = 0x2719DA   # vanilla vj row (tid & 0x0F) — the Victor
expect_vj_alias_p2 = 0x271DEC   #   records the variant rows alias today

