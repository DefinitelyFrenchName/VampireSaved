input = "236P, j.236P"
kind = "special"
notes = "Projectile; usable in air; ES = Sol Smasher (ES); MEASURED 14z-120: ground LP/MP/HP all enter ONE chain a2:0x26 (the strength is a parameter of the projectile); air j.236P -> a2:0x2a. a2:0x27-0x29 / 0x2b-0x2d are byte-identical twins never entered"
table = "a2"
seq = "0x26,0x2a"

[[move]]
