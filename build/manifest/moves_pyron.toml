input = "41236PP, 41236KK"
kind = "ex"
notes = "Either pair; the pair can be held to delay, the move comes out at release of the buttons; a PP/KK variant is believed to exist; MEASURED 14z-120: PP and KK, held or tapped, enter a2:0x3c (class 18, one stock); the rig could not distinguish a PP/KK variant by chain; 63214+PP at range produces NOTHING (5LP), so the tracker does discriminate the two half circles"
table = "a2"
seq = "0x3c"

[[move]]
name = "Piled Hell"
input = "623KK, j.623KK"
kind = "ex"
notes = "Ground or air; MEASURED 14z-120: ground and air both enter a2:0x45 -> a2:0x46 -> a2:0x47, one stock"
table = "a2"
seq = "0x45"

