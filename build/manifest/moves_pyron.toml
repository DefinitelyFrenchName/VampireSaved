# build/manifest/moves_pyron.toml — the maintainer's move list for Pyron
# (character-data map, phase 1). Transcribed 14z-120 (2026-08-30) from the
# maintainer's list; no move name, input or property here is Claude's —
# the notes are the maintainer's words, normalised.
# Schema: build/manifest/moves_TEMPLATE.toml (flat rows, tools/_minitoml.py).
# CONVENTIONS: see the header of moves_donovan.toml (numpad inputs, ES =
# two punches / two kicks as its own row, Dark Force = P+K, guard cancel =
# 623P/K in blockstun for 1 stock). Pyron's guard cancel is Zodiac Fire.
# Maintainer-answered 2026-08-30: Galaxy Trip has SIX destinations (one per
# button); a MP/HP command throw's ES is ANY two punches; Cosmo Disruption
# is one move by either pair (a PP/KK variant is believed to exist).


# NAMING STEP DONE 14z-120 (2026-08-30): every seq below was MEASURED on native
# vs2 (Pyron forced by the early-window poke) by tools/name_moves.py — see the
# Donovan file's header for the method; gate tests/test_move_naming.sh. The
# first pass measured half the roster MIRRORED (after a throw P2 stood behind
# P1 and 623 became 421); the rig now pins both fighters' X far apart before
# every event (a near event walks in from there) and samples the facing byte.

# ---- throws -------------------------------------------------------------

[[move]]
name = "Corona Whip"
input = "4MP, 6MP, 4HP, 6HP"
kind = "throw"
notes = "Ground throw, must be performed up close; direction by 4/6, MP or HP; MEASURED 14z-120: 6HP and 4MP enter a2:0x1e then a2:0x20 (one throw chain); a 6MP that whiffed at pushbox contact came out as a2:0x03 — the odd standing ids are 6+button attacks for Pyron too"
table = "a2"
seq = "0x1e"

[[move]]
name = "Galactic Throw"
input = "j.4MP, j.6MP, j.4HP, j.6HP"
kind = "throw"
notes = "Air throw, must be performed up close; direction by 4/6, MP or HP; MEASURED 14z-120 (P2 scripted to jump with P1): MP and HP both enter a2:0x23"
table = "a2"
seq = "0x23"

[[move]]
name = "Planet Burning"
input = "63214MP, 63214HP"
kind = "throw"
notes = "Command throw; ground throw, must be performed up close; MP or HP; ES = Planet Burning (ES); MEASURED 14z-120: MP and HP enter a2:0x1e (the throw start shared with Corona Whip) -> a2:0x21 -> a2:0x22; a whiff at range runs the same chains"
table = "a2"
seq = "0x21"

[[move]]
name = "Planet Burning (ES)"
input = "63214PP"
kind = "es"
notes = "ES of Planet Burning; any two punches; ground throw, must be performed up close; MEASURED 14z-120 (2), P1 facing right, up close: 63214 + MP&HP, LP&HP or LP&MP all enter the SAME chains as the plain throw, a2:0x1e -> a2:0x21 -> a2:0x22, with the object's class byte 16 and one stock spent (like Sol Smasher's ES). An earlier reading that 63214PP gave Cosmo Disruption was the RIG facing LEFT (a mirrored 41236) — retracted"
table = "a2"
seq = "0x21"

