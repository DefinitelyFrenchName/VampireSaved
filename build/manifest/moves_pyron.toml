input = "236PP, j.236PP"
kind = "es"
notes = "ES of Sol Smasher; projectile; usable in air; MEASURED 14z-120: the SAME chains as the plain move, distinguished only by the object's class byte (16 vs 14) — one stock spent; ground a2:0x26, air a2:0x2a"
table = "a2"
seq = "0x26,0x2a"

[[move]]
name = "Zodiac Fire"
input = "623P"
kind = "special"
notes = "Pyron's guard cancel: can be guard cancelled into (623P in blockstun) for 1 meter stock; ES = Zodiac Fire (ES); MEASURED 14z-120: LP/MP/HP -> a2:0x2e/0x2f/0x30 then the tail a2:0x35; a forward rush of ~180 px with attack boxes"
table = "a2"
seq = "0x2e,0x2f,0x30"

[[move]]
name = "Zodiac Fire (ES)"
input = "623PP"
kind = "es"
notes = "ES of Zodiac Fire; MEASURED 14z-120: a2:0x31 then a2:0x35, one stock"
table = "a2"
seq = "0x31"

[[move]]
name = "Orbital Blaze"
input = "j.214K"
kind = "special"
notes = "Air only; tatsu-type move; ES = Orbital Blaze (ES); MEASURED 14z-120: j.214LK/MK/HK -> a2:0x36/0x37/0x38 (the motion right after take-off; at the apex the HK version whiffed into a plain j.HK)"
table = "a2"
seq = "0x36,0x37,0x38"

[[move]]
name = "Orbital Blaze (ES)"
input = "j.214KK"
kind = "es"
notes = "ES of Orbital Blaze; air only; tatsu-type move; MEASURED 14z-120: a2:0x39, one stock"
table = "a2"
seq = "0x39"

[[move]]
name = "Galaxy Trip"
input = "421LP, 421MP, 421HP, 421LK, 421MK, 421HK, j.421LP, j.421MP, j.421HP, j.421LK, j.421MK, j.421HK"
kind = "special"
notes = "Teleport; SIX destinations, one per button; usable in air; NO ES version; MEASURED 14z-120: ALL twelve inputs (six buttons, ground and air) enter ONE chain a2:0x3a -> a2:0x3b; the destination is a parameter — measured from x=552: LP -> x-40 in the AIR (y=128), HP -> x+220 in the air, LK -> x-35 on the ground, HK -> x+230 on the ground (P = air, K = ground; L/M/H = distance)"
table = "a2"
seq = "0x3a"

# ---- EX ------------------------------------------------------------------

[[move]]
