vsavj = 0x05459a
kind = "patched_clone"
status = "verified"
clone_src = 0x05459a
clone_len = 0x44
patch_old = "024000ff"
patch_new = ""
note = "unmasked set-anim entry; false byte-match to the masked vsavj twin"

