# vsavj.toml — the null patch: rebuild vanilla vsavj from reference members.
# Acceptance (SPEC M0): every output member SHA-1 equals the frozen reference
# manifest (docs/checksums.txt). No patches, no provenance other than VSAV.
#
# A [[file]] entry names one output member and its source "zip/member" in
# ROMDIR. Later milestones add [[file.patch]]/asm hooks here; tunables become
# builder flags, never manifest hex edits (CLAUDE.md §5 build conventions).

[set]
name = "vsavj"
description = "Vampire Savior (Japan 970519) — null build"

[[file]]
name = "vm3j.03d"
source = "vsavj.zip/vm3j.03d"
provenance = "VSAV"

