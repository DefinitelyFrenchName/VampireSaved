# build/manifest/moves_donovan.toml — the maintainer's move list for Donovan
# (character-data map, phase 1). Transcribed 14z-120 (2026-08-30) from the
# maintainer's corrected list; no move name, input or property here is
# Claude's — the notes are the maintainer's words, normalised.
# Schema: build/manifest/moves_TEMPLATE.toml (flat rows, tools/_minitoml.py).
#
# CONVENTIONS (maintainer, 2026-08-30):
#   - inputs in numpad notation, no '+'; P/K = any strength; "by button" in
#     notes when the strength picks a variant. `j.` = airborne.
#   - ES: a special that has one is performed with two punches / two kicks
#     (623P -> 623PP). Each ES version is its OWN row (kind = "es") because
#     it usually owns its own chain; the parent special's row names it.
#   - Dark Force is P+K of the same strength for every character; listed
#     only for its name.
#   - Guard cancel: every character's is 623P or 623K (character-specific)
#     in blockstun for 1 meter stock; it is either one of their specials or
#     a dedicated guard-cancel-only special. Donovan's is Ifrit Sword.
#   - Plain normals / movement rows are skeletons (input = name): the
#     naming step matches them against the remaining chains; the
#     maintainer enriches the ones with specific properties (dash etc.).
#   - `table` / `seq` are filled by the naming step, never by hand.

