# ── Win-screen palette. SOURCE RE-DERIVED 14z-68h (ping #7 item 5:
# native = GOLD, ours = pink/lavender). The old row guessed
# pool+0x10*0xA0 from a "0x0111 head matches his family" eyeball that
# was flagged suspicious at authoring; it is WRONG. The real
# derivation, decoded from vs2's win drawer (the true twin of vsavj
# 0x5F1B6 is vs2 0x6B29C — note vs2 0x6B156 is the SELECT uploader,
# not this one):
#     d6 = char id; d0 = colour idx ($3AE(a4))
#     d6 = byteTable[d6]           <- vs2 0x6B2F2, THE NEWCOMER REMAP
#     offset = (18*d0 + d6) * 0xA0
#     a0 = pool 0x3C2BBC + offset
# vsavj's twin has no remap and an 17-row stride: (17*d0 + id)*0xA0.
# byteTable is a pc-relative BYTE table embedded in code, so it reads
# through the DATA view (the effect-byte-map precedent; the OPCODE
# view decodes to a plausible-looking identity ramp 00,01,02,... that
# is garbage — docs/GOTCHAS.md "in-code pc-rel tables"). DATA view
# CORRECTED 14z-68m (maintainer side-by-side): the OPCODE view is the
# right one after all, proven by DONOVAN's independently verified row
# (14z-45, row-for-row against native win palette RAM): his id 0x13 ->
# opcode table[0x13] = 0x11 -> POOL + 0x11*0xA0 = 0x3C365C = exactly
# his frozen vs2_src. So table[0x10] = 0x0B and H's set is
#     0x3C2BBC + 0x0B*0xA0 = 0x3C329C
# whose ramp is BRIGHT ORANGE->YELLOW (0e90 0fb0 0fc5 0ff3 0ff7 0fff),
# matching the native capture. SELF-CHECK: the last word of each
# 0x20-byte row is a marker = 5*row — H's rows carry 0x37-0x3B
# (5*0x0B) and Donovan's carry 0x55-0x59 (5*0x11). My earlier
# 0x3C635C was Donovan's row at colour variant 4 (markers 0x55-0x59),
# i.e. I had given Huitzil DONOVAN'S palette.
# Colour stride stays 18*0xA0 = 0xB40 (unchanged, and now derived
# rather than assumed).
# ── 14z-68m WIN-PORTRAIT POSITION (maintainer: "the win screen is
# shifted to the left, like Donovan back when we ported him" — and
