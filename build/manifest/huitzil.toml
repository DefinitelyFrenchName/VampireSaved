# ── Tenant jump-seq dispatch (14z-66, item 3 — float/air dash): vs2's
# OWN engine head for the class-02 jump seq (vs2 0x213F2) routes by
# char id — `cmpi #6 -> Anakaris's family; cmpi #$10 -> 0x2592A` — the
# 0x2592A dispatcher IS Phobos's per-char jump handler (five
# sub-states: 1 = the flavor-forked float/hover with the 0x78-frame
# timer at +0x1C0, 3 = the +0x23-gated air action, 4 = the jump
# restart). The x02592a region is that handler cloned whole (root in
# build_donovan.sh). vsavj's twin head 0x22A0E carries only the
# Anakaris test; this thunk displaces that 6-byte cmpi and reproduces
# vs2's routing: tenant -> jmp the clone's dispatcher (region_subst,
# +0); everyone else -> re-execute the Anakaris cmpi (allowlisted id
# literal — a re-executed VANILLA compare, not a tenant gate) and jmp
# back to the INTACT beq.w at 0x22A14, whose flags come from that
# cmpi exactly as vanilla. jmp_ok: both paths re-enter by jmp only.
# (First attempt hooked 0x26A76 = ANAKARIS's handler — the
# content-twin trap: vsavj keeps a byte-identical copy of the generic
# head inside his per-char family; the live generic handler is
# 0x22A0E via the class-02 stepper 0x225C4. Measured: 0 thunk hits,
# timer never armed.)
# The clone's word-form pcrel escapes (35 unique targets, censused) get
# trampolines in an adjacent pad; targets resolved by the jump-family
# alignment rows in the overlay (+ x026142 via placement). 0x269ac stays
# open/tripwired (operand-heavy helper, no pattern match yet).
[[pcrel_escape_fix]]
stage = 4
region = "x02592a"
pad = 0x120

