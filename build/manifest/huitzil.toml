# ── 14z-69: x06cac0's OWN pc-relative DATA TABLES — DESIGN SETTLED, NOT
# YET LANDED (STATE 14z-69i). The seven `lea (d16,pc),An` tables at
# 0x6D768-0x6D96C need `:f` on the root to sit inside the region (then the
# pointers resolve correctly — measured), and then the table bytes must be
# emitted RAW rather than as part of the region's encrypted code op, because
# CPS-2 decrypts OPCODE fetches only: a data read returns whatever is stored.
# Emitting them raw needs the region's code op SPLIT around the tables
# (overlapping ops are a named build error), which is a builder change.
# The [[data_in_code]] pointer-reroute path exists in the generator and
# works, but its helper must be within bsr.w of the site and hole_a's free
# space is ~0x27000 away — so the raw-emit design is the better one.

# ══ WITHDRAWN 14z-79 — THIS ROW BROKE BULLETA'S DARK FORCE ══════════════
#
# The row below is COMMENTED OUT. Its legacy-safety claim ("legacy NEVER
# REQUESTS THESE IDS") is RETRACTED: it is false, and the analysis under it
# is kept only as the record of how it was reached.
#
# WHAT IS ACTUALLY TRUE. Palette-seq ids 0x1E-0x21 are BULLETA'S DF block.
# Measured on vanilla vsavj with a stocked meter (P1 poked to 0x00): 236
# resolver calls, every one of them id 1e/1f/20/21. Controls on the same
# instrument: Demitri (0x01) -> 0x26, char 0x04 -> 0x44-0x47. The base id is
# hardcoded IN THE ROUTINE (`0640 001e` at 0x02a92c), and each character
# reaches a different routine, so these ids are per-character property.
#
# WHY H WAS ON THEM AT ALL — the real defect, still open. Row 0x10 of the
# per-character palette-routine table 0x02A8A4 is 0x004A, which is ROW 0x00'S
# handler: Phobos inherits BULLETA'S routine and therefore her base 0x1E.
# That aliased row is a known one — tests/test_variant_dispatch.sh has
# reported it as a FAIL on every run, and it was recorded as benign on the
# strength of "0 hits at the resolver" measured over replays in which nobody
# activated Dark Force. It is not benign.
#
# THE COLLISION IS STRUCTURAL, which is why this row cannot simply be fixed
# in place. In vs2, slot 0x10 IS Huitzil and id 0x1E is HIS block (measured
# on native: 180 calls on id 0x1E with $FF802E=1). In vsavj id 0x1E is
# Bulleta's. Both characters legitimately want the same id and the merged ROM
# has one row. Repointing 0x02A8A4 row 0x10 at vs2's value (0x0040) does not
# work either — but NOT for the reason first given here. RETRACTED 14z-79b:
# "that routine has no DF path at all" was read off five instructions at
# 0x02a8e4 (`cmp.b (0x14f,a6),d0 / bne.w / rts`) without following the bne.w,
# which goes to 0x030ee8. The census disproves it: char 0x04 holds the SAME
# row value 0x0040 and DOES request ids 0x44-0x47. That routine is conditional
# and is shared by characters with and without palette requests, so what
# repointing row 0x10 to 0x0040 would give Phobos is UNKNOWN and must be
# MEASURED, not asserted either way.
#
# THE PROPER FIX, deferred as its own piece: give Phobos his OWN palette-seq
# block — a free 4-row id block, a copy of Bulleta's routine with that base
# substituted, 0x02A8A4 row 0x10 repointed at it, and 0x1E-0x21 left vanilla.
# All tenant-scoped, all inside the op invariant.
#
# UNTIL THEN his DF is purple again — wrong versus native, and harmless to
# every legacy character, which is the trade the maintainer chose (14z-79).
# Cost of NOT doing this: a vanilla character rendered wrong on every Huitzil
# build since 14z-69, invisible to every RAM gate because the palette path
# never transits work RAM. Found by maintainer playtest, not by the suite.
#
# HOW THE GUARD MISSED IT: tests/audit_palette_seq_ids.sh runs a
# Demitri-heavy replay set in which Dark Force never activates, so it sampled
# {0x26, 0x27} — Demitri's own block — and generalised. An audit whose
# replays cannot produce the mode it guards cannot report on that mode.
#
# ── 14z-69p: THE DARK FORCE PALETTE (ping #7 / #11 item: "purple
# recolour while moving"). MECHANISM, measured:
# H's DF drives a palette-SEQUENCE animation, not a static swap. One
# writer — the engine uploader family at 0x2AD64 (probe at 0x2AD68) —
# rewrites sprite palette row 0x0A every frame from DF entry, cycling
# FOUR rows of the GLOBAL palette-seq table. The resolver is 0x2AD82:
#     a0 = 0x39A900 + (d0 & 0xFFF) * 0x20
# and the ids H's script requests are 0x1E, 0x1F, 0x20, 0x21 (152 calls
# in one DF, measured). vsavj's rows at those ids are a PURPLE ramp
# (0222 0fff 0faf 0fcf 0e8f ...) where vs2's are his GOLD one
# (0111 0fea 0fb8 0e96 0b75 ...). Same ids, different global-table
# contents between engines — the exact class as Donovan's sword/statue
# blink (14z-33).
#
# WHY A DATA ROW IS SAFE HERE, and how it was established. The trigger
# is not a call we own (it arrives through the channel machine's
# program-byte dispatch at 0x29F4A — only THREE opcodes, none of them
# ours), so a wrap would have to sit on engine code that legacy runs
# 800-3800 times per replay. Instead: legacy NEVER REQUESTS THESE IDS.
#   *** RETRACTED 14z-79 — FALSE. Bulleta requests exactly these ids in
#   *** Dark Force (236 calls, measured on vanilla). See the WITHDRAWN
#   *** header above. Everything below this line is the superseded
#   *** analysis, kept for the record.
# Audited with an uncapped probe on 0x2AD82 across ten legacy replays
# (tests/audit_palette_seq_ids.sh): the only ids vanilla ever asks for
# are 0x26 and 0x27. Rewriting rows 0x1E-0x21 is therefore inert for
# legacy by construction — and the audit is committed so the claim is
# re-checkable rather than remembered.
# CAUTION for whoever revisits this: the palette path is INVISIBLE to
# every RAM gate (palette ROM -> palette RAM never transits work RAM),
# so the regression suite CANNOT catch a mistake here. The audit test
# is the only guard. Raise GUARD_PROBE_MAX when re-running it — the
# default 400-hit cap silently truncated the first audit and hid id
# 0x27 entirely.
#
# WHICH SOURCE ROWS — the part that took two attempts. The obvious
# choice, vs2's rows at the SAME ids (0x3B0DFC), is WRONG: vs2 never
# runs this DF path for him, so those slots hold whatever vs2 uses them
# for, and copying them just swapped purple for tan/blue (measured, in
# emulator). The right source was found from the OTHER end — dump
# native's palette row 0x0A during a real DF and look at what it
# actually contains:
#     f333 f840 fc40 fe70 ff90 ffa3 ffd5 fff8 ... f003
# The trailing 0x0003 is a palette-seq row's SELF-INDEX, so native's DF
# colour IS a seq row, the 4th of its sequence. Searching vs2 for that
# exact content lands at 0x3ABF3C, whose sequence starts at 0x3ABEDC —
# four rows, tails 0000/0001/0002/0003, a warm ramp. That block is the
# source. (It sits BELOW vs2's own table base 0x3B0A3C, so native
# reaches it by a different uploader path — irrelevant here: we only
# need the CONTENT at the ids our build requests.)
# Provenance: vs2 0x3ABEDC and vhunt2 0x38BEB0 hold the byte-identical
# blob (unique occurrence in vh2), and the four rows' self-index tails
# (0000/0001/0002/0003) match vsavj's at the destination, which is what
# proves the window is row-aligned on rows 0x1E-0x21 and not shifted.
# [[data_port]]
# stage = 4
# name = "df_palette_seq_rows"
# src = 0x3ABEDC
# orc = 0x38BEB0
# dst = 0x39ACC0
# dst_end = 0x39AD40
# len = 0x80
# dst_old_head = "05310fff0e9e0ece0d7e093e064d045c"
# note = "DF palette-seq rows 0x1E-0x21 <- the sequence native DF actually shows (vs2 0x3ABEDC)"

# ══ 14z-84 PHOBOS' OWN DF PALETTE BLOCK (maintainer pull-forward) ═══════
#
# THE PROPER FIX the 14z-79 withdrawal deferred. Design ratified by the
# maintainer 2026-08-13 (STATE 14z-84 triage): the ROW-0x10 TENANT
# ROUTINE SELF-SUPPLIES — no funnel thunk (0x2AD44 never-thunk rule; the
# resolver is the same hazard class), no resolver-window allocation (the
# window has ZERO padding, measured), no shared-block hijack (the 14z-69p
# defect).
#
# MECHANISM, from disassembly (all measured this session):
# - Table 0x02A8A4 rows are SIGNED WORD displacements from the table
#   base; row 0x10 currently aliases row 0x00 (0x004A = Bulleta's
#   routine at 0x2A8EE) — WHY his DF was purple: her routine requests
#   ids 0x1E + step(0..3, advanced every other frame via the $B4(a5)
#   parity bit) + $381(a6)*4 (the player side), i.e. HER 8-row block.
# - The resolver (0x2AD82) computes a0 = 0x39A900+(id&0xFFF)*0x20 and
#   enters the shared uploader at 0x2AD3C. Our thunk computes a0 itself
#   (gold block + (step+side*4)*0x20) and enters 0x2AD3C identically.
# - vs2's OWN row 0x10 is the bare default (0x0040, no DF path); native
#   gold arrives by another path whose vs2 ids (0x5A5-family, signed-lea
#   wrap below the vs2 base 0x3B0A3C) resolve to 0x3ABEDC. Both sides'
#   rows (P1 0x3ABEDC, P2 0x3ABF5C, 0x80 each) verified against the vh2
#   twin 0x38BEB0+0x100 BYTE-IDENTICAL.
#
# PLACEMENT: the trampoline lives in table 0x02A8A4's OWN alias half —
# rows 0x19-0x1B's word slots (0x2A8D6, vanilla "004000e40124" = the
# row 0x09-0x0B aliases). Those bytes are read ONLY by indexing ids
# 0x19-0x1B, which cannot occur: legacy never writes an id in 0x10-0x1F
# (tests/audit_id_writers.sh), 0x12/0x18 are refused by the id guards,
# and the roster occupies 0x10/0x11/0x13. Reviewed shared-surface write
# (build/manifest/shared_writes.toml).
#
# THE BODY is Bulleta's routine 0x2A8EE TRANSCRIBED with exactly these
# substitutions: far pc-rel branches -> abs jmp/jsr (0x2ADAC the vanilla
# changed-path, 0x2AD3C the uploader); the 0x2A7E0 skip target -> a
# local rts (that target IS a bare rts); the base add
# `addi.w #$1e,d0 / bra 0x2AD82` -> `lsl.w #5,d0 / movea.l #gold,a0 /
# adda.w d0,a0 / jmp 0x2AD3C` (the resolver's own computation, our
# block). Step/side state bytes ($195/$381 a6) are the fighter's own —
# per-object, no sharing.
[[site_thunk]]
stage = 6
name = "df_gold_variant_id"
only_variant_slot = true
site = 0x02A8D6
old_hex = "004000e40124"
patch = "jmp"
rts_ok = true
thunk_hex = "4a2e0111660eb02e014f66024e754ef90002adacb02e014f67064eb90002adac082d000000b4670260024e75102e01955200020000031d4001957200122e0381e549d041eb48207cggggggggd0c04ef90002ad3c"
data_subst = "gggggggg=0x3ABEDC:0x100:wide_ext"

# THE ROW WORD MUST BE A CODE OP, NOT A DATA POKE (measured 14z-84: the
# aux_poke form shipped 0x0032 into the DATA view, the dispatcher reads
# the table PC-RELATIVELY through the OPCODE view, and the word decrypted
# to 0x56EA — a wild jump and a watchdog reset on the first Phobos
# palette tick; the boot screen at f3420 was the reset). code_word emits
# a code op so crypt-range re-encryption applies — the code_ptr/beam
# precedent, and exactly what this row kind was built for (14z-22).
[[code_word]]
stage = 6
name = "df_seq_entry_10"
only_variant_slot = true
slot_table = 0x02A8A4
slot_stride = 2
old_hex = "004a"         # base-half row 0x00's word; the variant row is
                         # anchored on ALIASING it (the machinery checks)
new_hex = "0032"         # -> 0x2A8A4+0x32 = 0x2A8D6, the trampoline

# ══ 14z-73 THE GRAB-HOLD VICTIM PLACEMENT ═══════════════════════════════
#
# THE DEFECT, measured on both legs (tests/test_hui_grab_victim.sh): during
# H's grab the VICTIM is held at the wrong offset — native holds it +78px in
# FRONT of the attacker, ours snaps it -27px BEHIND (~109px). Setup is
# byte-identical across legs (chars, facing, seq 0x0E timing, 0x13 damage);
# only the victim's per-frame position diverges, from grab onset.
#
# ROOT CAUSE. The victim's hold position is written by a shared engine
# CAPTURE POSITIONER (vsavj 0x28058; H's grab reaches it via the ported
# clone at 0xc9eb0, since 0x27282 falls inside H's ported region x026142):
#   victim_pos = attacker_pos +/- facing-flipped per-frame (Xoff,Yoff)
# read from a per-ATTACKER-char KEYFRAME block via pointer table 0xBE27A,
# indexed by attacker id (movea.l #$be27a,a0; movea.l (a0,id*4),a0). vsavj
# row 0x10 (Huitzil) = 0x092C4A, an ALIAS of row 0x00 (char 0's block) — so
# H holds the victim with character 0's offsets. vs2 row 0x10 = 0x0C56AA =
# H's OWN block. This is H's missing twin of Donovan's throw_victim_keyframes
# (donovan.toml:711, same slot_ptr_table). Block is position-independent
# (internal refs are block-relative word offsets); vs2/vh2 byte-identical
# through the structural end (32-entry victim header, max off 0x1BE0 + record
# span -> 0x1D80; sibling identity holds to 0x1E1A). Superset-safe: only the
# tenant's row 0x10 is repointed; every vanilla row and the host block
# (0x092C4A) stay untouched. Fixes both the clone and the vanilla engine
# readers at once (both read 0xBE27A). Verify: GRAB_VICTIM_EXPECT=matches.
[[data_port]]
stage = 6
name = "grab_hold_keyframes"
src = 0x0C56AA
len = 0x1D80
orc = 0x0C4F3C
dst = 0x092C4A
dst_end = 0x094954
dst_old_head = "0040011001e002b003800450052005f0"
slot_ptr_table = 0xBE27A
hole = "wide_ext"
note = "grab-hold victim keyframes: row 0x10 <- H's own block (vs2 0x0C56AA), was char-0 alias 0x092C4A"

# ══ 14z-71 THE BEAM: effect-CLASS row 16 ════════════════════════════════
#
# THE DEFECT, measured on both legs rather than reasoned about. Every
# secondary-object pool has a per-frame dispatcher that reads the object's
# CLASS from field +0x02 and jumps through a table of handler pointers:
#
#   vsavj 0x080A90   move.b 0x02(a6),d0 / add.w d0,d0 / add.w d0,d0
#                    movea.l (0x12,pc,d0.w),a0 / jsr (a0) / lea 0x80(a6),a6
#
# The beam pool's table is 38 rows at vsavj 0x080AAC (vs2 0x08F1D6, vh2
# 0x08EDE2 — index-aligned 1:1 across all three sets). vsav ships rows
# 16/17/19/31 as STUBS pointing at the bare `rts` right after the table;
# vs2/vh2 fill 16/17/19. **Row 16 is the beam's.**
#
# Our build was never missing the object, the class, or the dispatch. With
# a read watchpoint on each leg's OWN row-16 slot, over replay 83b:
#
#   native vsav2   598 reads, A0 = 0x093460  (48 inside the beam window)
#   ours  (hui17)  593 reads, A0 = 0x080B44  (46 inside it) = THE STUB
#
# Same frames, same objects ($FFD400/$FFD480), same D0 = 0x40 (class 16 x 4).
# The handler is the only thing absent, which is exactly why the freeze
# works while the muzzle orb and beam never draw: they are one object that
# is dispatched into a no-op.
#
# WHY A BARE TABLE-ROW WRITE AND NOT AN obj_hook. The tables are the same
# LENGTH in both sets, so nothing needs rebuilding or relocating; only one
# dead row changes. That costs no engine site patch and no legacy cycles —
# strictly less than a hook, and the standing "vanilla wins ties" principle
# points the same way.
#
# WHY IT IS SUPERSET-SAFE. Row 16 is DEAD in vanilla, measured, not argued:
# 0 reads across the whole frozen legacy suite (01-10) plus the walljump
# and throw replays, against a 1760-hit positive control on row 37 taken
# with the same instrument on the same leg. Committed as
# tests/audit_effect_class_rows.sh so the claim stays re-checkable.
# `old_hex` pins the slot to the stub, so a table that ever moves fails the
# build loudly rather than silently repointing someone else's row.
#
# INSTRUMENT NOTE, paid for in-session: this table is read PC-relatively,
# and on CPS-2 every pc-relative read is served by m68k_read_pcrelative_*
# = AS_OPCODES. A plain `wpset` watchpoint is SILENTLY BLIND to it and
# reports zero hits — which reads as "this row is never used" and inverts
# the finding. Use the opcodes space (WATCH=...,r,o -> wposet).
[[code_ptr]]
stage = 4
name = "beam_effect_class16"
addr = 0x080AEC
old_hex = "00080b44"
region = "x093460:0x0"
note = "effect-class row 16 -> the ported vs2 row-16 handler family (the beam)"

# ── 14z-71 THE BEAM, stage 2: vsav's sprite-list drawer has no LIST TYPE 12
#
# Fixing the class-16 dispatch above exposed a SECOND, independent defect
# underneath it. With the handler in place the beam object finally enters
# its animation and the muzzle orb draws — and then the game dies with a
# vec3 at f3176.
#
# THE DRAWER. Every object's sprite list is dispatched by:
#     01AFA6  movea.l 0x1C(a6),a0     ; the object's anim node
#     01AFAA  movea.l 0x04(a0),a0     ; -> its sprite list
#     01AFAE  move.w  (a0)+,d0        ; the list's TYPE word
#     01AFB0  move.w  (0x08,pc,d0.w),d0
#     01AFB4  jmp     (0x04,pc,d0.w)  ; table at 0x01AFBA
#
# THE TABLE LENGTH IS SELF-ENCODING — entry 0's own offset IS the table
# size, because handler code begins immediately after the last entry:
#     vsavj  entry0 = 0x000C -> 6 entries, types 0..10
#     vs2    entry0 = 0x000E -> 7 entries, types 0..12
#     vh2    entry0 = 0x000E -> 7 entries  (the sibling agrees with vs2)
# The beam's sprite list is TYPE 12. On vsavj that indexes two bytes PAST
# the table, fetches 0x3A18, and jumps to 0x01E9D2 — the middle of an
# engine data table (measured: CRASH 3176 vec3 PC 01e9d6 ADDR 0001e9f7,
# A6=ffffd400 = the beam object, D0=00003a18 = the off-table word).
# So the table cannot simply be extended: there is no room, by construction.
#
# WHAT TYPE 12 IS. vs2's handler (0x01A1FC, 0x3A bytes) is a COMPOSITE /
# GROUP list — a count followed by N x {dx, dy, sub-list pointer}, each
# sub-list drawn by RECURSING into the drawer, with the offsets accumulated
# in d4 and flipped by the facing bit. Exactly the shape a multi-segment
# beam needs. vsav has no equivalent anywhere: the handler's first 0x0C
# bytes do not occur in the vsavj image at all.
#
# THE MECHANISM — why this thunk shape and not the obvious ones.
# The dispatch is (d8,PC,Xn), so the table cannot be moved out of line (an
# 8-bit displacement reaches nothing free), and it cannot grow in place.
# Displacing the two instructions AT 0x01AFAA instead lets the legacy path
# rejoin the VANILLA dispatch at 0x01AFB0, which needs nothing but a0 and
# d0 — both of which the thunk reproduces exactly. Legacy therefore
# executes Capcom's own instructions with two jmps added around them; no
# table is replicated, no register is juggled, no stack trick is needed.
#
# LEGACY-INVARIANT BY CONSTRUCTION, and in the SAME class as the ratified
# shadow_seq_guard: only d0 == 12 diverges, and d0 == 12 cannot occur in
# vanilla — a legacy list of type 12 would index off the end of vanilla's
# own table and crash on real hardware. Everything else is a byte-for-byte
# re-entry into the untouched vanilla dispatch. Cost to legacy is cycles
# only (two jmps per sprite-list dispatch, measured ~0.73 dispatches per
# frame), i.e. the ratified hook class — the flicker inventory is
# re-measured with it in, per the CLAUDE.md §4 standing watch.
#
# THE BODY IS A TRANSCRIPTION, not authored logic. Offsets +0x0E..+0x47 are
# vs2's 0x01A1FC handler VERBATIM, with exactly two bytes changed: the
# recursion `bsr.w 0x199DC` displacement F7BC -> FFD2, retargeted to this
# body's own list entry (+0x04) so it is placement-independent. The
# `bpl.b 6ACC` loop-back byte comes out IDENTICAL to vs2's, which is a
# free structural check that the transcription kept its spacing.
# tests/test_beam_list_type12.sh asserts the byte-identity so a hand edit
# cannot drift from Capcom's code silently.
#
# THE A5 SCRATCH MUST BE RELOCATED — and the first answer here was WRONG.
# The handler parks count/list/d4 at -0x4A80/-0x4A84/-0x4A88(a5) = RAM
# $FF3580/$FF357C/$FF3578, inside a 0x200-byte vsavj buffer at $FF3502
# that match init clears (0x016E04). Measured with a WORKING instrument:
# vanilla makes 39 accesses to those exact ten bytes per match replay, so
# vs2's displacements CANNOT be kept verbatim; whichever route is taken,
# the three slots need a window audited free.
# RETRACTED, and worth keeping as the reason: the first measurement said
# "0 accesses" and it was an instrument artefact. trace_writes.lua matched
# the WATCH length with %d+ while MAME parses that length as HEX, so a
# ten-byte window ("a") failed the pattern, the assert killed the run
# before the replay started, and the empty trace read downstream as a
# clean zero. A dead instrument and a real finding are the same shape from
# the outside. The tracer now matches hex and every section of
# tests/audit_effect_class_rows.sh carries a same-instrument positive
# control, which is what turned the zero back into 39.
# ── 14z-71 THE BEAM, stage 2: TAKE OVER THE DEAD LIST-TYPE 6
#
# THE PROBLEM. vsav's sprite-list drawer has SIX list types (0..10); vs2 has
# SEVEN (0..12). The table length is self-encoding — entry 0's own offset IS
# the size, because handler code begins immediately after the last entry — so
# it can neither grow in place nor move out of line (the dispatch is
# `(d8,PC,Xn)`; nothing free is within an 8-bit displacement). The beam's
# sprite list is TYPE 12: a COMPOSITE, a count then N x {dx, dy, child list},
# each child drawn by recursing into the drawer. vsav has no such handler
# (its first 0x0C bytes occur nowhere in the vsavj image).
#
# WHY NOT FLATTEN. The obvious fix — bake the composite into one ordinary
# list — measures far bigger than it looks: 39 composite lists in the ported
# anim region, 83 children, and 24 of those children are TYPE 4, a procedural
# strip generator whose output depends on the runtime facing bit. Those cannot
# be pre-baked into static coordinates.
#
# WHY NOT HOOK THE DRAWER. Measured and rejected: two extra jumps on every
# sprite-list dispatch took 04_select_fuzz from 3 flicker frames to 1514
# divergent frames with no re-convergence. (The cost is not magnitude —
# ~42 cycles on ~2 dispatches/frame — so it cannot be optimised away.)
#
# THE MECHANISM. vsav ships TWO list types nothing uses. Types 6 and 8 measure
# ZERO reads across six legacy replays, against same-instrument controls of
# 4329 / 2702 / 2260 / 321 reads on types 2 / 10 / 0 / 4
# (tests/audit_effect_class_rows.sh). Nothing else points into the type-6
# handler, the two bytes before it are type-4's `rts` skip target (so there is
# no fall-through into it), and H's own content uses neither type. So: write a
# 6-byte `jmp` over the dead type-6 handler head and change the type word on
# our own 39 composite lists from 000C to 0006 (the port_patch rows below).
# Capcom's composite code then runs VERBATIM, procedural children and all.
# Cost to legacy: zero cycles — nothing legacy executes changes.
#
# *** THE ASSUMPTION IS DELIBERATELY NOT LOAD-BEARING (maintainer, 14z-71) ***
# "Dead" here means measured-by-absence, and absence of evidence is not
# evidence of absence — we may simply have missed how vsav uses type 6. So the
# body does NOT assume it. It discriminates on an ADDRESS RANGE — is this list
# inside our own placed anim region? — which is exact and dereferences nothing
# that could be wild. Anything that is NOT ours falls through to vsav's
# ORIGINAL type-6 code, reproduced instruction-for-instruction and rejoined by
# jmp at 0x01B6B2. **If the deadness measurement is wrong, vanilla still
# renders correctly**; we merely pay a few cycles on a dispatch legacy is
# measured never to make.
#
# AND IT ANNOUNCES ITSELF — BY EXECUTION, NOT BY A COUNTER (amended 14z-91,
# maintainer-decided 14z-89 ruling (2)). The fallback used to bump a counter
# at RAM $FF010C. The deadness claim it guarded turned out FALSE — 14z-89
# measured legacy lists reaching type 6 on `21_don_mash` (387x) and
# `26_don_arcade_mash` (948x) — and the design worked exactly as intended:
# rendering stayed correct because the fallback runs vsav's own type-6 code.
# But $FF010C/$FF010D is live work RAM vanilla does not keep, so those two
# legacy replays could never re-converge with the vanilla basis and sat
# `.pending`. The counter write is now REMOVED and
# tests/audit_effect_class_rows.sh §4 watches the fallback's EXECUTION
# instead — it already PC-attributes every hit, so it needs the event and
# never the counter's value. Zero legacy RAM perturbation, no mask window.
# The gate now holds a FROZEN per-replay execution inventory rather than
# demanding zero: a gate that fails on a known-nonzero event is permanently
# red and gets ignored. Drift in EITHER direction is the stop-and-assess
# event, and per the maintainer's standing instruction THIS ROW IS A FIRST
# SUSPECT for any unexplained vanilla rendering regression.
#
# THE SCRATCH IS AUDITED, NOT INHERITED. vs2's own A5 displacements land in a
# live vsavj buffer ($FF3578-$FF3581, 39 accesses per match replay), so the
# three slots were moved to $FF0100-$FF010B: 36 accesses in vanilla, ALL of
# them the boot clear, none after frame 900 — measured on four legacy replays
# and on our own build during the beam replay. ($FF010C/$FF010D was the
# tripwire counter's slot and is no longer written at all, 14z-91.)
#
# THE BODY IS A TRANSCRIPTION. Offsets +0x10..+0x49 are vs2's 0x01A1FC handler
# instruction-for-instruction; the only changes are the scratch
# displacements and `bsr.w 0x199DC` -> `jsr 0x0001AFAE.l` (the untouched
# vanilla "list already in A0" drawer entry). Verified against vs2 by
# tests/test_beam_list_type6.sh.
#
# BODY LENGTH 0x102 -> 0xFE (14z-91), removing `526d810c`
# (`addq.w #1,(-0x7EF4,A5)` = the $FF010C tripwire counter) at +0x4A. ONE
# branch crossed the cut and moved with it: the `bsr.w` at +0x32 to the
# body's OWN local child dispatcher, displacement 0x2C -> 0x28 (target
# +0x60 -> +0x5C). Everything else is unaffected — the two entry branches
# at +0x06/+0x0E target +0x4A itself, which is still the fallback head
# because the deleted bytes were AT the cut, and every branch after the cut
# shifts wholesale so keeps its displacement. Both rejoin jumps are
# ABSOLUTE (0x0001B6B2 / 0x0001B73C) and do not move. Machine-verified: the
# full branch inventory maps one-to-one under the shift.
[[site_thunk]]
stage = 4
name = "beam_list_type6"
site = 0x01B6AA
old_hex = "3a18be456500"
patch = "jmp"
rts_ok = true
region_subst = "aaaaaaaa=anim:0x0,bbbbbbbb=anim:0x1e800"
thunk_hex = ""
note = "take over vsav's list-type 6 for the composite lists; non-tenant lists fall through to vanilla type 6 (NOT unused — legacy reaches it, measured 14z-89: 21_don_mash 387x, 26_don_arcade_mash 948x; the fallback is what keeps it correct). Diagnostic-only since 14z-91: no work-RAM counter, execution watched by audit_effect_class_rows.sh §4"

