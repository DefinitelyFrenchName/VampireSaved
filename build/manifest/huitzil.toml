# ── Select-portrait palettes (14z-67): vs2's OWN uploader remaps H
# INTO the grid at column 0x0B (`cmpi #$10 -> moveq #$B,d6`, measured
# at vs2 0x6B1A6) — no dedicated block like Donovan's 0x3C2A3C. His 10
# variant rows are the grid column: 0x3C117C + (v*16 + 0x0B)*0x20 =
# 0x3C12DC + v*0x200 — gathered contiguous by the data_subst x10@0x200
# form (added 14z-67). Thunk body identical to Donovan's (d0 =
# min(variant,9); block indexed d0*0x20).
[[site_thunk]]
stage = 6
name = "select_pal_variant_id"
only_variant_slot = true
site = 0x05F146
old_hex = "0c0600126606"
thunk_hex = "0c0600tt661c3d7c30000018207cpppppppp0c40000963027009588f4ef90005f1623d7c200000180c06001266024e75588f4ef90005f152"
data_subst = "pppppppp=0x3C12DC:0x20:wide_ext:x10@0x200"

# ── Variant-id HUD rows (the 14z-63 mechanism, H's values read 14z-67
# from vs2's DATA-view tables: name entry 0x10 = 04AB 0102 FFE8 0002,
# mug entry 0x10 = 05A0; vs2 stager bias +0x4200 -> art codes 0x46AB
# (plate 2x1) / 0x47A0 (mug 2x2), both verified non-blank). Free-pool
# anchors 0xBE92 (plate) / 0xBE9A (mug; bottom row 0xBEAA-AB pooled);
# vsavj stager bias -0x3800 gives the poke values.
[[aux_poke]]
name = "hud_mug_entry_10"
