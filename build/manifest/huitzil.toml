# ── 14z-79: (b') — THE OUT-OF-RANGE INDEX WINDOW OF `0x018468` ────────────
# Fixes TWO confirmed Phobos defects with one change, and retires the whole
# danger window of this dispatcher for every tenant.
#
# THE CLASS. vsavj's sub-state table at 0x018468 has 80 entries; vs2's twin
# (0x016D34) has 84. A ported character carries vs2's indices verbatim, so
# entries 80-83 read the words of the NEXT dispatcher (`323b 0006 4efb 1002`
# at 0x018508) as offsets:
#
#   80  0x323B -> 0x01B6A3  ODD -> vec3                        LOUD  (none live)
#   81  0x0006 -> 0x01846E  the table itself -> reset          LOUD  (Pyron
#                                                  Cosmo, fixed in his data)
#   82  0x4EFB -> 0x01D363  ODD -> vec3       PLASMA TRAP      LOUD
#   83  0x1002 -> 0x01946A  real code -> WRONG ROUTINE         SILENT
#                                             REFLECT WALL
#
# Plasma Trap (air 214+MK) crashed on every Phobos build while every gate
# stayed green; Reflect Wall (623+P guard cancel) has been running the wrong
# routine in silence.
#
# 14z-78 PREDICTED that this would also fix the knockback discrepancy filed in
# tests/replays/hui/81_hui_rw_gc.rpl's header ("alias physics, queued").
# MEASURED 14z-79, AND THE PREDICTION IS WRONG: attacker x @f3240 is 476 on
# hui27 and 476 on hui28, i.e. UNCHANGED by this thunk. That item stays
# queued. (The header's "474" does not reproduce on today's instrument
# either — see the note appended to the replay.)
#
# WHY NOT THE ONE-BYTE RETARGET that fixed Pyron's Cosmo (14z-75)? Full-body
# twin search over the 80 in-range handlers: entries 80/81/83 have twins, and
# 82 and 83 — the two that are actually LIVE — do not. Entry 82 writes the
# literal class 0x52, which no vsavj handler writes. So (a) cannot preserve
# behaviour and (b') was approved for the full 80-83 window.
#
# LEGACY-SAFE BY IMPOSSIBILITY, not by a deadness measurement. Vanilla
# reaching entries 80-83 CRASHES today, so no legacy behaviour can depend on
# the branch this adds. That is the whole argument, and it is needed: the
# conservative static deadness scan saturated (all 80 entries "used"), so no
# in-range entry could be proved free.
#
# TWO MEASUREMENTS SHAPE THE BODY (14z-79); the design recorded in STATE
# 14z-78 was wrong on the first and made unnecessary by the second.
#
#  1. THE TABLE READS THROUGH THE OPCODE VIEW. The spec had the thunk read it
#     with `lea 0x018468,a0 / move.w (0,a0,d0.w),d1`. That is a DATA-space
#     read and CPS-2 decrypts only program-space fetches (docs/platform/
#     gotchas.md), so it returns ciphertext: 38 of the 80 legacy targets come
#     out ODD — an address error on the hottest path in the game. The body
#     therefore carries its OWN copy of the index table and reads it
#     PC-relatively; inside a `code` op it re-encrypts with the body, so the
#     read decrypts back to what we authored.
#
#  2. D1 AND THE CCR ARE FREE. The 80 handlers reduce to 23 distinct targets;
#     none reads the condition codes on entry, and D1 is dead on entry to
#     every one (the only handler that touches D1, 0x01867A, writes it
#     first). So the dispatcher's `d1 = offset` result is never consumed, and
#     the normal path needs no borrowed register and no stack: the spec's
#     save/restore dance — whose failure mode was a SILENT 4-byte-per-dispatch
#     stack leak — is deleted rather than verified.
#
# WHAT LEGACY PAYS: two compares and one extra jmp, touching D1 (dead) and the
# CCR (free) and writing NOTHING to RAM. Trampolines exist because
# `jmp (2,PC,d1.w)` reaches +/-32K and the handlers are ~0xE4A48 from hole_a.
#
# EVERY OTHER INDEX IS LOUD. The danger dispatch is four EXACT equality tests,
# so nothing merely >= 0xA0 picks up entry 80's handler. Odd d0 faults exactly
# as vanilla does (odd read, vec3); even d0 >= 0xA8 — unreachable, since vs2's
# own table stops at 83 — is trapped to an odd address for a defined vec3
# rather than a wild jump. Exhaustively simulated over all 65,536 index
# values: 80/80 legacy entries reach their vanilla handler, 4/4 danger
# entries run vs2's body byte-for-byte, and there is NO silent path.
#
# THE BODY IS GENERATED, NEVER HAND-TYPED:
#   python3 tools/gen_index_window_thunk.py \
#       build/out/vsavj_opcodes.bin build/out/vsav2_opcodes.bin
# and tests/test_index_window_thunk.sh reconstructs it from the two ROMs
# rather than diffing it with a tolerance.
#
# OWNED BY PHOBOS (maintainer decision, 14z-79): both live defects are his,
# and Donovan/Pyron were cleared by full movelist sweeps — all their
# candidates sit at LOUD entries. Keeping the row here costs ONE re-freeze and
# leaves the other three frozen fingerprints as independent oracles for the
# rest of M3b. The merged build still gets the cover: the thunk tests no
# character id.
#
# `rts_ok`: 0x018460 is not a subroutine head — it is the tail of subroutine
# 0x018230 (0 jsr/jmp/Bcc targets land on it; its only caller is the bsr.w at
# 0x018216), so a handler's `rts` returns to 0x01821A. `rts` is therefore the
# correct exit for the four inline bodies, exactly as vanilla's handlers do.
[[site_thunk]]
stage = 4
name = "index_window_018468"
site = 0x018460
old_hex = "323b00064efb"
patch = "jmp"
rts_ok = true
thunk_hex = ""
note = "(b') 14z-79: entries 80-83 run vs2's handlers inline; every other index takes the vanilla path or a defined vec3. Fixes Plasma Trap (82) and Reflect Wall (83)"

