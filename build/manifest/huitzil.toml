# huitzil.toml — port configuration for the Huitzil/Phobos tenant (M3b
# Phase 4 ladder, opened 14z-65). Consumed by tools/gen_donovan_patch.py via
# --port (driver: TENANT_MANIFEST/TENANT_CHAR on tools/build_donovan.sh).
#
# MINIMAL BY DESIGN: this starts as the stage 1-3 ladder manifest (null
# relocation -> passive data -> anim/sub-tables), the same falsifiable
# ladder Donovan's M2a climbed. Stage 4+ rows (engine hooks, extra roots,
# aux pokes, palettes, thunks) are added ONLY as their mechanisms are
# measured for THIS character — donovan.toml is the reference for the
# shapes, not a template to copy blind.
#
# Huitzil has NO stock-track id: he is a variant-id tenant only (0x10 —
# Bulleta's variant row, measured-free, docs/atlas/id_space.md), so every
# build of this manifest requires --profile cps2-wide-v1 (the generator
# enforces this; a stage 1-3 build still packs as a stock-shaped vsavj zip
# because nothing allocates in wide_ext yet).
#
# The VS2/VH2 flavor fork exists for Huitzil (community-confirmed; the
# Donovan [init_shim] wiring is the template) — flavor rows land at his
# stage 4-5 with maintainer decision D1 (STATE.md 14z-65).

[[tenant]]
name = "huitzil"
src_set = "vsav2"
src_char = 0x10
id = 0x10
# 14z-65: the slot-clearing alloc wrappers (the Donovan row — his init
# and H's both allocate satellites via vs2 0x15702/0x1572E, and vs2's
# allocator semantics need the 0x80-clear wrapper on vsavj; without it a
# recycled round-2 slot keeps stale bytes under the pod init).
alloc_wrap = "0x15702,0x1572e"
# 14z-65: his rows live in the overlay — the shared map is frozen for
# Donovan's reproducibility (see reconciliation_huitzil.toml header).
recon_overlay = "build/manifest/reconciliation_huitzil.toml"
# 14z-66 (playtest round-1 item 2, "feels a bit slower"): port his true
# param32_a/b velocity pairs into variant rows 0x10 — both vsavj tables
# are 32-row with 0x10-0x1F as byte aliases of 0x00-0x0F (measured), and
# all three consumers index the RAW id (no fold), so he was moving at
# Bulleta's row-0 content via the alias. The 14w-b VALUE_SKIP stays the
# generator DEFAULT (Donovan's landmine, undecoded); this opt-in is
# gated on H's own full soak battery (the hazard re-exam).
port_param32 = true

# ── Pool-seeding init shim + flavor latch (14z-65, the watchdog-reboot
# hunt). Vanilla vsavj never seeds the secondary-object pools during a
# normal match; vsav2 always does, and the newcomers' ecosystems allocate
# from them (the Donovan lesson — his shim exists for exactly this). An
# allocator on an unseeded pool hangs without an exception: the measured
# symptom (handler entered at f2886, no fault, watchdog reboot).
# seed_entry/latch_disp are ENGINE facts (vsavj's own seeder aggregator,
# pool-0 free-list head), not Donovan-specific. Huitzil HAS the VS2/VH2
# Start-hold fork (community-confirmed, Donovan+Huitzil only);
# flavor_default 0x01 = VS2 per decision D1 (maintainer, PROVISIONAL
# 2026-08-07 — flip this one value if the final call differs).
[init_shim]
dispatch = "dispatch_00"
seed_entry = 0x016C64
latch_disp = 0x7966
# 14z-65: phase-gated latch — H's ecosystem drains pool 0, so the bare
# head latch re-seeds LIVE pools at round-2 re-init (the f4890 wipe).
latch_mode = "phase"
objram_clear = false
flavor_disp = 0x3C2
flavor_default = 0x01
flavor_held = 0x00
flavor_hold_flag = 0xFF8060

# ── Layout group (14z-65, THE watchdog-reboot fix): the sibling-insertion
# boundary at 0x57456 splits his dispatch_00 handler MID-ROUTINE — the
# aux jsr is region "code"'s last 6 bytes and the handler body is
# x057456's head. Without source-relative spacing the post-jsr
# fall-through executes alloc padding + the next region's bytes (measured:
# probe fired at code-end with execution wandering; watchdog reboot).
# x055478 rides along: its tail routines end near its bound and its jmp
# into x057456 then keeps its source displacement.
[[layout_group]]
regions = "code,x057456"

# ── ADDRESS-SPACE MODEL — same shape as donovan.toml's; duplicated for the
# single-tenant ladder. The M3b Phase 2 multi-tenant merge hoists this into
# a SHARED manifest (one image, one allocator) — until then the two
# manifests' single-tenant builds each start from pristine vsavj and may
# not be naively merged (the 14z-65 op-overlap assertion would catch it).
[[space]]
name = "hole_a"
start = 0x0BF6A0
end = 0x100000
class = "crypt"
fallback = "hole_b"

[[space]]
name = "hole_b"
start = 0x3EC720
end = 0x400000
class = "raw"
fallback = "wide_ext"

[[space]]
name = "wide_ext"
start = 0x400010
end = 0x600000
class = "raw"
profile = "cps2-wide-v1"

# ── Companion queue-class remap (14z-65 — the Donovan/Anita precedent,
# donovan.toml's identical row): the shared x088512 zone registers
# companion-class objects in vs2's update-queue class 7, which does not
# exist on vsavj (7 classes, 0-6). Unremapped, the registration leaves a
# stale vs2-encoded queue node; after the round-2 pool re-seed the node
# dispatches a freed slot (measured: the f4983 crash, PC in palette
# space). Same remap: class 7 -> vsavj's last class 6.
[[port_patch]]
region = "x088512"
src_addr = 0x08B0F8
old_hex = "000e"
new_hex = "000c"
note = "companion queue class 7 (vs2-only) -> vsavj class 6 (the Anita precedent)"


# ── Secondary/companion object type dispatch (14z-65 — THE f4983 fix):
# both engine type-dispatch sites, same rows as donovan.toml. His pod is
# secondary type 0x73 (115; struct +0x02 = type, +0x03 = owner id) — with
# the sites un-hooked, the vanilla 114-entry table was over-indexed and
# the movea.l fetched CODE bytes past the table (the traced 0x323B0006
# jump). The generator builds the union table (vanilla verbatim + ported
# extras from HIS extraction; unresolved types tripwire loudly).
[[obj_hook]]
site = 0x054470
vanilla_table = 0x054484
vanilla_entries = 59
src_table = 0x05C620
src_entries = 76

[[obj_hook]]
site = 0x05E542
vanilla_table = 0x05E556
vanilla_entries = 114
src_table = 0x06A51C
src_entries = 124

# ── Shadow-seq guard (14z-66, THE second FG crash): the per-player
# shadow/reflection servants (class-0x0C trio, vanilla spawner 0x489DE+)
# mirror the owner's anim by reading each anim NODE's +0xC word (low 13
# bits = a seq id) into the SHARED shadow tables at 0x2083BC/0x2087CA
# (row space 0x40E each, hardcoded at the installer 0x823E2/0x823F2, NOT
# per-char). H's ported nodes carry VS2 seq ids verbatim — his
# transformation node's 0x488 over-indexes into sequence DATA, fetches a
# garbage odd offset, vec3 at the engine installer (replay 77, f3398,
# guard timeline). vs2's twin table (0x1E42D2) is simply larger.
# The thunk displaces the walk jmp at 0x8245C (stack-neutral patch="jmp"):
# seq*2 >= 0x40E -> clamp to seq 0 (the default shadow every sparse
# vanilla row already falls back to; the +0x50 cache keeps the raw id so
# the walk does not thrash). The clamp is deliberately UNGATED by char
# id: FG is a CAPTURE-class super — the VICTIM (a vanilla char) plays
# H-supplied capture anims, so it is the victim's servant that
# over-indexes (measured: crash servant owner id 0x0C = P2; an owner==TT
# gate missed it, build 22ea24f9). Legacy behavior is invariant by
# construction — no vanilla content can produce an out-of-range seq
# (it would vec3 on vanilla hardware); the boot gate's masked-v2 EXACT
# leg verifies the cycles/skew side.
# RESTORE AT THE GFX/NATIVE-SHADOW PASS: the same site redirects
# out-of-range seqs to an EXTENDED table (vs2 rows ported) instead of
# clamping.
# ── FG capture-pose table reroute (14z-66, THE third FG crash — the
# maintainer's "a bit later after the capture"): his FG picks each
# barrage hit's victim capture pose RANDOMLY — seq = table16[rand&15],
# the 16-byte table embedded IN HIS CODE at vs2 0x56074 and read as
# DATA (`lea (0x26,pc),a1; move.b (a1,d0.w),d0`). The code region sits
# in the crypt hole, where placed bytes are stored re-encrypted for
# opcode fetches — the runtime DATA read saw garbage (0xFF drawn where
# native reads 01/03/05), and the garbage seq over-ran the VICTIM's
# per-char capture table (vanilla sets at 0xBCE7A+, the Midnight-Bliss
# family) -> vec3 with per-victim/per-draw signatures. Random draw =
# why casts sometimes survived. data_in_code relocates the DATA-view
# bytes to a raw hole and reroutes the reader (ghost-clean jsr+nop).
[[data_in_code]]
region = "code"
table = 0x056074
table_len = 16
reader = 0x05604C
reader_old_hex = "43fa002610310000"
note = "FG capture-pose random table (native draws seqs 1/3/5)"

# The census (14z-66: scan of all crypt-placed regions for the
# lea(pc)+read-(An,Xn) shape with an in-region target) found FOUR more
# instances of the same class — rerouted preemptively before any
# playtest finds them. The two 0x56/0x59 tables are the FG family's
# second pose set; 0x564AC duplicates the 01/03/05 content; the
# x088512 one is a word offset/record table the POD code both indexes
# AND re-derives a pointer from (self-relative offsets reach +0x78+,
# hence the generous copy span).
[[data_in_code]]
region = "code"
table = 0x056064
table_len = 16
reader = 0x056020
reader_old_hex = "43fa004210310000"
note = "FG capture-pose table 2 (seqs 0x56-0x59)"

[[data_in_code]]
region = "code"
table = 0x05649C
table_len = 16
reader = 0x056458
reader_old_hex = "43fa004210310000"
note = "capture-pose table 3 (seqs 0x56-0x59 twin)"

[[data_in_code]]
region = "code"
table = 0x0564AC
table_len = 16
reader = 0x056484
reader_old_hex = "43fa002610310000"
note = "capture-pose table 4 (01/03/05 twin)"

[[data_in_code]]
region = "x088512"
table = 0x08C042
table_len = 0x100
reader = 0x08BFF6
reader_old_hex = "47fa004a30330000"
note = "pod-zone word offset/record table (a3 re-derived from it; self-relative)"

