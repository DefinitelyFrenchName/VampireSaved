# ── The ported per-char OBJ bank table copy (x026142 tail).
# Rows = the VANILLA vsavj 0x282D4 values, with Pyron's own row 0x11 =
# 0x1000 (his sprites fetch from WIDE bank 4 on any read path that
# resolves through the ported copy). Row 0x10 stays vanilla: there is no
# tenant at 0x10 in this build.
#
# HISTORY (14z-74) — do not "restore" the odd values you may see in older
# builds. A generator bug used to corrupt this table: the
# pcrel_escape_fix blob pass scanned the region for `bra.w/bsr.w` (any
# `0x6000`-form word) and rewrote the word AFTER it, and it ran after
# table_fix over a range covering this table, which is DATA. Any row
# holding 0x6000 therefore clobbered the row following it — rows
# 0x01/0x0A/0x0C came out as 0x0074/0x0068/0x006A on every tenant build,
# and Pyron's TENANT row lost its 0x1000 -> 0x0066. Fixed at the source
# (maintainer decision D5, 14z-74): the scan now skips the table_fix
# span, so the declared values below are what actually lands.
[table_fix]
stage = 6
region = "x026142"
pad_len = 0x1440
table_off = 0x13EE
rows_hex = "600060000000200060000000400040000000600040006000600000000000400060001000000020006000000040004000"
note = "ported per-char OBJ bank table -> vanilla vsavj values + row 0x11 = WIDE bank 4"

# ── vsavj's own per-char OBJ bank table (0x282D4): the engine's char-init
# reads row = runtime char id. Variant row 0x11 is a vanilla alias of row
# 0x01 (the generator's alias anchor); superset-safe because no legacy
# gameplay path assigns ids 0x10-0x1F (tests/audit_id_writers.sh).
[[code_word]]
stage = 6
name = "obj_bank_word_slot"
slot_table = 0x0282D4
slot_stride = 2
old_hex = "6000"
new_hex = "6000"
new_hex_variant = "1000"

# ── Sprite + effect palettes (14z-74; the Donovan/H template). Maintainer
# playtest: "palettes are wrong" — this is that gap. His blocks are read
# from vs2's own per-character palette POINTER tables, row 0x11:
#     sprite  vs2 0x396B94[0x11] = 0x39C19C   (len 0x500, = H's stride)
#     effect  vs2 0x396C14[0x11] = 0x3AC45C   (len 0xDC0, = H's stride)
# Strides cross-checked against rows 0x0F-0x13 on both tables, and against
# H's frozen rows (0x39BC9C / 0x3AB69C), so the row indexing is anchored and
# not inferred from Pyron alone. src_head_hex pins the block so a table that
# ever moves fails the build loudly instead of porting silently-wrong colour.
# extra_tables mirrors the vanilla third-table sharing exactly as H's and
# Donovan's do.
[[palette]]
name = "sprite"
stage = 6
src = 0x39C19C
len = 0x500
src_head_hex = "0e000f600f900fb0"
table = 0x38C198

# EFFECT PALETTE — DEFERRED, and deliberately NOT ported (14z-74).
# Porting it caused a visible 30Hz BLINK on Pyron's sprite, measured:
# palette RAM row 10 (0x90C140) alternated every frame between his correct
# block and a competing one, where NATIVE holds it CONSTANT (native animates
# rows 1/2/3 only; ours animated 1/2/3 AND 10).
# ROOT CAUSE: the effect palette table at 0x38C218 has only SIXTEEN rows
# (0x00-0x0F) — 0x38C258 is the NEXT table, and it is a COPY of the first
# rows (the "vanilla third-table sharing"). A variant id therefore indexes
# PAST the table: row 0x11 lands at 0x38c25c = extra-table row 0x01, which
# vanilla uses (0x3923e0). The sprite table 0x38C198 is 32 rows, so the
# sprite row above is legitimately inside it — that half is sound and stays.
# NOTE FOR THE MERGE: Huitzil's frozen row has the SAME shape (his row 0x10
# lands at 0x38c258 = extra-table row 0x00), so this is a shared hazard, not
# a Pyron-only mistake; it simply has not produced a reported symptom on him.
# Legacy is intact either way (measured: replay 02 on the effect-ported build
# was still the ratified select-wheel window only).
# CROSS-TENANT CHECK (14z-74, maintainer asked whether Phobos is exposed):
# NO — measured on the same rig, palette-row churn over 15 frames:
#     PYRON   (0x11)            rows 1,2,3 AND 10   <- the blink
#     HUITZIL (frozen m2, 0x10) rows 1,2,3          = native
#     DONOVAN (frozen m3a,0x13) rows 1,2,3          = native
# So the blink is Pyron-specific, not a shared tenant hazard. It is also a
# DIFFERENT phenomenon from Donovan's old "sword/statue blink" (14z-33),
# which was BANK ATTRIBUTION — records of two banks processed with one
# bank's semantics, rendering real art from the wrong place (geometry
# right, content someone else's). Pyron's is palette RAM: a palette-SEQUENCE
# animation (uploader PC 0x02AD68) rewriting row 10 every other frame where
# native writes it zero times. Same visible word, unrelated mechanisms.
# Note the maintainer also sees the in-match HUD MUGSHOT blinking — and that
# mugshot is DEMITRI's (his HUD rows are unported), which confirms the churn
# is a shared palette ROW, not Pyron's own art.
#
# TO FIX PROPERLY: determine how the engine resolves an effect palette for a
# VARIANT id (a 16-row table cannot hold one) — either a fold, a separate
# variant table, or a thunk — before writing anything in that region.

