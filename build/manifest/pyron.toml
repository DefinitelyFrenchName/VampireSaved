# ── THE OBORO SELECT HOOK (W1, 14z-105; maintainer-ruled 2026-08-22:
# vanilla vsavj Oboro, not a vs2 port). vsavj ships Oboro Bishamon COMPLETE
# at variant id 0x18 (base 0x0B3450) and the commit path accepts the id
# end-to-end (demonstrated live 14z-104 (3)) — it only lacks a player-
# facing select path. This hook IS that path, and it is vanilla's own
# Gallon-variant idiom one cell over: at PRG:0x020B9C the confirm
# subroutine tests `cmpi.b #$2,$382(a6)` (on Gallon?) then
# `btst #7,$394(a6)` (START held — MEASURED 14z-105: with P1 Start held on
# the select screen the struct's input word reads $8000, $0000 without)
# and commits 0x12. Displacing that first cmpi with a jsr, the thunk
# tests Bishamon (0x08) + the same Start bit and commits 0x18, then
# re-executes the displaced cmpi so the vanilla `bne` at 0x020BA2 sees the
# flags it expects (0x18 != 2 -> the Gallon block is skipped, exactly as
# for any non-Gallon id). Without Start held, or on any other cell, the
# body is branch-inert and the cmpi's flags are the vanilla ones. The
# $bf(a5) gate that precedes the site in vanilla precedes the hook too.
# Declared identically by every tenant: ENGINE-SITE, emitted once.
# profile-gated: roster UX, WIDE-only by construction (stock twin
# bit-identical). id_literal_ok: the body compares the char id against
# Bishamon's 0x08 ON PURPOSE (and re-executes vanilla's own #$2 test).
#   0c2e00080382  cmpi.b #$8,$382(a6)
#   660e          bne.s  .van
#   082e00070394  btst   #7,$394(a6)
#   6706          beq.s  .van
#   1d7c00180382  move.b #$18,$382(a6)
#   0c2e00020382  .van: cmpi.b #$2,$382(a6)   (the displaced instruction)
#   4e75          rts
