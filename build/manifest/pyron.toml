# ── The ported per-char OBJ bank table copy (x026142 tail).
# Rows = the VANILLA vsavj 0x282D4 values, with Pyron's own row 0x11 =
# 0x1000 (his sprites fetch from WIDE bank 4 on any read path that
# resolves through the ported copy). Row 0x10 stays vanilla: there is no
# tenant at 0x10 in this build.
#
# HISTORY (14z-74) — do not "restore" the odd values you may see in older
# builds. A generator bug used to corrupt this table: the
# pcrel_escape_fix blob pass scanned the region for `bra.w/bsr.w` (any
# `0x6000`-form word) and rewrote the word AFTER it, and it ran after
# table_fix over a range covering this table, which is DATA. Any row
# holding 0x6000 therefore clobbered the row following it — rows
# 0x01/0x0A/0x0C came out as 0x0074/0x0068/0x006A on every tenant build,
# and Pyron's TENANT row lost its 0x1000 -> 0x0066. Fixed at the source
# (maintainer decision D5, 14z-74): the scan now skips the table_fix
# span, so the declared values below are what actually lands.
[table_fix]
stage = 6
region = "x026142"
pad_len = 0x1440
table_off = 0x13EE
rows_hex = "600060000000200060000000400040000000600040006000600000000000400060001000000020006000000040004000"
note = "ported per-char OBJ bank table -> vanilla vsavj values + row 0x11 = WIDE bank 4"

