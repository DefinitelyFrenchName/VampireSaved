# pyron.toml — port configuration for the Pyron tenant (M3b Phase 5
# ladder, opened 14z-67). Consumed by tools/gen_donovan_patch.py via
# --port (driver: TENANT_MANIFEST/TENANT_CHAR on tools/build_donovan.sh).
#
# MINIMAL BY DESIGN (the huitzil.toml doctrine): this is the stage 1-3
# ladder manifest — null relocation -> passive data -> anim/sub-tables.
# Stage 4+ rows (init shim, engine hooks, sound stubs, thunks) are added
# ONLY as their mechanisms are MEASURED for THIS character; huitzil.toml
# and donovan.toml are references for the shapes, never templates to
# copy blind.
#
# Pyron facts already on the record (do not re-derive):
# - Variant-id tenant ONLY (0x11 — measured-free variant row,
#   docs/game/atlas/id_space.md); every build requires --profile cps2-wide-v1.
# - NO VS2/VH2 flavor fork (community-confirmed; D2 opens only if the
#   Phase-1-style measurement shows real vs2<->vh2 divergence).
# - Extraction is oracle-clean bare (14z-65 machinery, re-verified
#   14z-67): single code region 0x574C0+0x5200 (+0x30 shift, one 0xC
#   dead filler at +0x234), anim 0x264086+0x1B500, 769 engine refs,
#   ZERO char-id 0x11 immediates in code (unlike H's one site).
# - Both structural censuses CLEAN on his code region (14z-67,
#   tests/test_census_regions.sh section 2): 0 data_in_code, 0 pcrel
#   escapes. His support-zone roots are NOT extracted yet — the census
#   reruns as the R1 loop grows the region set (the gate's region-count
#   lock fails loudly then, by design).
# - gfx layout share RESERVED (build/manifest/gfx_layout3.toml row
#   "pyron": band 0x4ED5-0x8647 at DELTA 0, bank 4). His select
#   portrait palettes are a DEDICATED +0xBC row block in vs2 (measured
#   14z-67 at the vs2 0x6B1A6 compare chain) — the Donovan block shape,
#   NOT H's grid column.

[[tenant]]
name = "pyron"
src_set = "vsav2"
src_char = 0x11
id = 0x11
# 14z-67 (first mash-soak crash, vec3 f3383 in the OBJ emitter): a
# recycled effect slot ($FF9500) carried stale bytes under his
# satellite init — the alloc_wrap class exactly (his code calls the
# vs2 allocator pair like H's and Donovan's; vs2's allocator semantics
# need the 0x80-clear wrapper on vsavj). Same row as theirs.
alloc_wrap = "0x15702,0x1572e"
# His rows live in a per-tenant overlay — the shared map is frozen for
# Donovan's reproducibility (the reconciliation_huitzil.toml precedent).
recon_overlay = "build/manifest/reconciliation_pyron.toml"
# ── PHYSICS PARAMS (14z-74): port his param32 rows — velocities, jump
# params and the rest of the 32-bit per-character parameter families.
# WITHOUT this his rows fall back to a vanilla alias and he moves under
# ANOTHER CHARACTER'S physics (Huitzil hit the same thing: "all three
# consumers index the RAW id (no fold)"). MEASURED against the native
# vsav2 leg, same replay and inputs
# (tests/replays/pyron/73_pyron_air_214p.rpl), neutral jump:
#     native  jump yv 548864   gravity -28672 (-0x7000)
#     before  jump yv 507904   gravity -24576 (-0x6000)
#     after   jump yv 548864   gravity -28672   <- matches native EXACTLY
# This is the leading explanation for the maintainer-reported air 214+P
# runaway: an air special whose upward velocity is tuned for HIS gravity is
# never pulled back under someone else's, so he rises until the Y position
# wraps and, never landing, never returns control.
#
# RETRACTED (14z-74, same session): an earlier revision of this comment
# claimed the flag BREAKS LEGACY (replay 02 diverging to f5520 with no
# re-convergence) and refused it. That was a MEASUREMENT ARTIFACT — the
# legacy check had been chained immediately after a rebuild in one step, and
# the very same artifact also produced a FALSE failure on a build that did
# not carry the flag. Re-measured in isolation, twice, on a freshly built
# image: with the flag the legacy replay is the ratified select-wheel window
# and nothing more (divergent frames 787, ONE run, 889..1675, 3845 identical
# frames after). Lesson, and it cost a wrong commit: never chain a legacy
# measurement onto a build in the same step, and re-run before believing a
# gate that contradicts a previous green.
port_param32 = true

# ── ADDRESS-SPACE MODEL — same shape as the other tenants'; duplicated
# for the single-tenant ladder. The M3b Phase 2 merge hoists this into a
# shared manifest; until then single-tenant builds each start from
# pristine vsavj and may not be naively merged (the op-overlap assertion
# would catch it).
[[space]]
name = "hole_a"
start = 0x0BF6A0
end = 0x100000
class = "crypt"
fallback = "hole_b"

[[space]]
name = "hole_b"
start = 0x3EC720
end = 0x400000
class = "raw"
fallback = "wide_ext"

[[space]]
name = "wide_ext"
start = 0x400010
end = 0x600000
class = "raw"
profile = "cps2-wide-v1"

# ══ 14z-67 moveset arc: SHARED-ZONE rows — P ports the same shared
# regions H does, so every region-scoped mechanism row H carries for
# them applies to P's copies verbatim (the rows are properties of the
# SHARED SOURCE BYTES; the Phase-2 merge dedups by span). First soak
# crash (vec3 f3383, OBJ emitter, +0x1C NULL chain -> the data-view
# [0x4] read) = the pod-zone data_in_code class biting its FOURTH time:
# x088512 is crypt-placed and its embedded offset/record table read
# garbage under re-encryption, so his satellite's record never
# installed.

# Companion queue-class remap (vs2 class 7 -> vsavj class 6).
[[port_patch]]
region = "x088512"
src_addr = 0x08B0F8
old_hex = "000e"
new_hex = "000c"
note = "companion queue class 7 (vs2-only) -> vsavj class 6 (the Anita/H precedent)"

# Secondary/companion type-dispatch union (both engine sites — the
# vanilla tables over-index for newcomer types otherwise; the H f4983
# class). Unresolved extras tripwire loudly.
[[obj_hook]]
site = 0x054470
vanilla_table = 0x054484
vanilla_entries = 59
src_table = 0x05C620
src_entries = 76

[[obj_hook]]
site = 0x05E542
vanilla_table = 0x05E556
vanilla_entries = 114
src_table = 0x06A51C
src_entries = 124

# The pod-zone embedded offset/record word table (x088512+0x3AE4 reader
# — the 14z-66 data_in_code census row, shared bytes).
[[data_in_code]]
region = "x088512"
table = 0x08C042
table_len = 0x100
reader = 0x08BFF6
reader_old_hex = "47fa004a30330000"
note = "pod-zone word offset/record table (a3 re-derived from it; self-relative; shared-zone copy)"

# ── AIR DIVE per-strength velocity table (14z-74) — THE air 214+P BUG.
# Maintainer: air 214+P sends him off the top of the screen, wrapping
# vertically, controls dead; MP wraps at the LEFT edge, HP at the RIGHT.
#
# The move is the air dive (seq 0x0A, $100 = 4; driver vs2 0x057690). At
# 0x0576A8 it indexes a 3-row (xv.w, yv.w) table by button strength and
# then sets GRAVITY TO ZERO — so a wrong velocity is never pulled back and
# the state never reaches its ground check, which is why the controls die.
#
# The table is DATA at vs2 0x0576F4, read as `(a2)+ / (a2)` — i.e. through
# the DATA view — but it lives INSIDE his `code` region, which is placed in
# hole_a (class crypt) and therefore re-encrypted so the OPCODE view is
# faithful. The data view is then garbage. Measured:
#     vs2  DATA  0x0576F4 : 0388fc78 0388fc78 0388fc78
#     vh2  DATA  0x057724 : 0388fc78 0388fc78 0388fc78   (sibling oracle: it IS data)
#     ours DATA  (code+0x234): fc1cec8e e1d44d34 65292f3a  (garbage)
# decoded (xv, yv), native vs ours:
#     LP (904,-904) vs (-996,-4978)   -> dives into the floor, looks normal
#     MP (904,-904) vs (-7724,+19764) -> hard LEFT and UP   = the report
#     HP (904,-904) vs (+25897,+12090)-> hard RIGHT and UP  = the report
# Native is a clean 45-degree dive at every strength.
#
# TWO INSTRUMENTS MISSED IT, both worth fixing generically:
#   * extract.log calls these 12 bytes "1 dead filler zone (+0x234)". The
#     dead-filler classifier compares vs2 vs vh2 in the OPCODE view, where a
#     data table always differs — so a real table is indistinguishable from
#     junk. A cheap discriminator: if the two siblings' DATA views are
#     byte-identical, it is DATA (as here).
#   * tools/census_regions.py saw the lea(pc) but bailed in
#     `_redefines_an` on the next instruction `lea (a2,d2.w),a2` — an INDEX
#     ADD on the same register, where the pointer plainly survives. That is
#     why pyron.toml's "0 data_in_code" census line was wrong.
# A sweep of every lea(d16,pc),An in all 24 crypt-placed regions found
# exactly two data-view readers: the pod-zone row below, and this one.
[[data_in_code]]
region = "code"
shape = "pointer-inline"
table = 0x0576F4
table_len = 0xC
reader = 0x0576AE
reader_old_hex = "45fa00444e71"
note = "air-dive per-strength (xv,yv) rows; a2 re-derived by `lea (a2,d2.w),a2`"

# The shared zones' pcrel escapes (oracle-invisible; targets resolved
