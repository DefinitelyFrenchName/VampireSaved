# ── The ported per-char OBJ bank table copy (x026142 tail).
# Rows = the VANILLA vsavj 0x282D4 values, with Pyron's own row 0x11 =
# 0x1000 (his sprites fetch from WIDE bank 4 on any read path that
# resolves through the ported copy). Row 0x10 stays vanilla: there is no
# tenant at 0x10 in this build.
#
# HISTORY (14z-74) — do not "restore" the odd values you may see in older
# builds. A generator bug used to corrupt this table: the
# pcrel_escape_fix blob pass scanned the region for `bra.w/bsr.w` (any
# `0x6000`-form word) and rewrote the word AFTER it, and it ran after
# table_fix over a range covering this table, which is DATA. Any row
# holding 0x6000 therefore clobbered the row following it — rows
# 0x01/0x0A/0x0C came out as 0x0074/0x0068/0x006A on every tenant build,
# and Pyron's TENANT row lost its 0x1000 -> 0x0066. Fixed at the source
# (maintainer decision D5, 14z-74): the scan now skips the table_fix
# span, so the declared values below are what actually lands.
[table_fix]
stage = 6
region = "x026142"
pad_len = 0x1440
table_off = 0x13EE
rows_hex = "600060000000200060000000400040000000600040006000600000000000400060001000000020006000000040004000"
note = "ported per-char OBJ bank table -> vanilla vsavj values + row 0x11 = WIDE bank 4"

# ── vsavj's own per-char OBJ bank table (0x282D4): the engine's char-init
# reads row = runtime char id. Variant row 0x11 is a vanilla alias of row
# 0x01 (the generator's alias anchor); superset-safe because no legacy
# gameplay path assigns ids 0x10-0x1F (tests/audit_id_writers.sh).
[[code_word]]
stage = 6
name = "obj_bank_word_slot"
slot_table = 0x0282D4
slot_stride = 2
old_hex = "6000"
new_hex = "6000"
new_hex_variant = "1000"

# ── Sprite + effect palettes (14z-74; the Donovan/H template). Maintainer
# playtest: "palettes are wrong" — this is that gap. His blocks are read
# from vs2's own per-character palette POINTER tables, row 0x11:
#     sprite  vs2 0x396B94[0x11] = 0x39C19C   (len 0x500, = H's stride)
#     effect  vs2 0x396C14[0x11] = 0x3AC45C   (len 0xDC0, = H's stride)
# Strides cross-checked against rows 0x0F-0x13 on both tables, and against
# H's frozen rows (0x39BC9C / 0x3AB69C), so the row indexing is anchored and
# not inferred from Pyron alone. src_head_hex pins the block so a table that
# ever moves fails the build loudly instead of porting silently-wrong colour.
# extra_tables mirrors the vanilla third-table sharing exactly as H's and
# Donovan's do.
[[palette]]
name = "sprite"
stage = 6
src = 0x39C19C
len = 0x500
src_head_hex = "0e000f600f900fb0"
table = 0x38C198

# ── EFFECT PALETTE — PORTED 14z-76. His block is vs2 0x396C14[0x11] =
# 0x3AC45C, len 0xDC0, the same per-char stride Donovan's and H's rows use
# (cross-checked against rows 0x0F-0x13 on the same table). The block holds
# the palette-effect rows the uploader family 0x2AD20 serves: the electrocute
# X-ray body tint, Dark Force / status tints, flash and aura rows.
#
# THIS ROW WAS DEFERRED FOR TWO SESSIONS ON TWO REASONS. BOTH ARE WRONG.
#
# 1. RETRACTED (14z-76) — "the table at 0x38C218 has only SIXTEEN rows, so a
#    variant id indexes PAST it into the adjacent shared table at 0x38C258,
#    whose row 0x01 vanilla uses". IT IS ONE 32-ROW TABLE indexed by the full
#    character id, exactly like the sprite table 0x38C198 above it. Three
#    independent measurements:
#      * the reader at PRG:0x02AFA2 is
#            movea.l #$38c218,a0 / moveq #0,d1 / move.b $382(a6),d1 /
#            lsl.w #2,d1 / movea.l (a0,d1.w),a0
#        — the RAW id byte, no fold and no mask. Same shape at 0x02AD20,
#        0x02B25A, 0x02B45C and 0x02B4CA;
#      * 0x38C258 has ZERO references in either ROM view — it is never a base
#        address. Nor is 0x38C1D8, the other claimed "table";
#      * both tables' variant halves alias the base half EXCEPT at rows 0x12
#        and 0x18, and 0x18 is Oboro Bishamon — a variant dataset vsav
#        genuinely ships. Two independent tables with the same two exceptions
#        is not coincidence.
#    So row 0x11 is an ordinary variant alias row that legacy never indexes
#    (tests/audit_id_writers.sh: no legacy path writes an id in 0x10-0x1F),
#    no different from the sprite row above it. tools/gen_donovan_patch.py
#    had this right all along — "the hand-rolled 0x1F MIRROR (0x38C258 ==
#    0x38C218 + 0x40 — measured, NOT a separate table)" — and this comment
#    block contradicted the generator for two sessions. Frozen by
#    tests/test_effect_palette_table.sh.
#
# 2. RETRACTED ALREADY, in STATE.md — "porting this row caused the 30Hz
#    blink". Removing it did not stop the blink. The blink was THREE aliased
#    palette-routine dispatch tables (0x2A8A4 / 0x2B650 / 0x73790), fixed
#    14z-75 and gated by tests/test_pyron_blink.sh. It was never this row.
#
# WHAT IT COST HIM WHILE UNPORTED: row 0x11 aliases row 0x01, so he wore
# DEMITRI's effect palette. 110/110 rows differ, 88% of the block's bytes.
# On the rows the readers actually select — 0x0A+variant, 0x00+variant,
# 0x680, 0x6C0 — Demitri gives ONE beige/gold ramp for every confirm-button
# variant (his rows 0x0A and 0x0B are byte-identical) where Pyron's own block
# gives fire (0x0A), green (0x0B) and violet (0x0C). Same magnitude as
# Donovan's pre-14z-12 state, which was plainly visible: the grey electrocute
# X-ray with purple electricity, which was Jedah's block, one table over.
#
# STILL-VALID ELIMINATIONS from the 14z-74/75 blink hunt, kept so nobody
# re-derives them: the ported ANIM NODES are correct (byte-identical to vs2
# at the right alignment — correlating puts ours 0x0D45C6 at vs2 0x2650EC —
# so it was never the air-dive class); the PALETTE-SEQ ID REMAP is correct
# (vsavj row 0x26 == vs2 row 0x1E, a uniform +8 shift the port already
# applies); 0x26 is NOT a dead row (one of only two ids legacy ever
# requests); and no native row carries the 2-state flip. Also retracted in
# 14z-75: the figure "ours 543 palette-seq calls / native 0" — it compared
