# ── COSMO DISRUPTION: the dead sub-state row (14z-74) ────────────────────
# THE DEFECT (maintainer playtest): the EX (41236 + hold/release 2P/2K)
# CRASHED and reset the game. Reproduced by tests/replays/pyron/
# 72_pyron_cosmo_2p.rpl: CRASH vec4 (illegal instruction) at PC 0x018498,
# then the whole match state zeroes — a watchdog reset, which is NOT a 68k
# exception, so the field trace and not the crash guard is what proves it.
#
# MECHANISM — the BEAM's defect class again. The shared engine dispatches
# this sub-state through a self-encoding, pc-relative jump table:
#     018460  move.w $18468(pc,d0.w),d1
#     018464  jmp    $18468(pc,d1.w)
# with d0 = 0xa2 (entry 81) at the crash. Entry 81 is IN RANGE — the table
# holds 265 entries and entry 0 (0x0212) self-encodes the length — but
# vsavj stores 0x0006 there, a displacement pointing back INTO the table.
# vs2's twin table (0x016d34, 277 entries; dispatcher 0x016d30) stores
# 0x023c = a real handler at vs2 0x016f70. So vsav ships the row as a STUB
# where vs2 fills it, and the ported character drives the engine straight
# into it; the jmp then executes the table's own data until it hits an
# illegal instruction.
#
# WHY THIS IS ONE WORD AND NOT A DISPATCH TAKEOVER. vs2's handler is eight
# position-independent bytes — `move.b 0x17(a3),0x54(a1) / rts`
# (136b001700544e75) — with no absolute or pc-relative operands. vsavj
# ALREADY CONTAINS those exact bytes at 0x01868C, which is table + 0x224 —
# and 0x0224 is the table's most common entry, i.e. the shared handler
# vanilla already points many live states at. So repointing entry 81 to
# 0x0224 reproduces vs2's behaviour EXACTLY with no ported code, no
# displaced instruction and no legacy cycles.
#
# SUPERSET SAFETY — measured, not argued. Entry 81 is DEAD in vanilla: a
# read watchpoint on its slot (0x01850A) in the OPCODES space (the table is
# read pc-relatively, so a plain wpset is blind — 14z-71) sees ZERO reads
# from the dispatcher across legacy replays 02 and 03, against a control on
# the live entry-0 slot that sees 13 and 8. The single hit each replay does
# show is frame 1 at PC 0x000926 — the boot ROM-checksum sweep, which the
# control shows too and which is excluded by PC.
# ══ WITHDRAWN 14z-75 — THIS "FIX" CORRUPTED LEGACY. DO NOT RESTORE. ══════
# The 14z-74 Cosmo Disruption fix wrote what it believed was "entry 81 of the
# sub-state jump table at 0x018468". IT IS NOT AN ENTRY. That table has
# exactly EIGHTY entries (0..79); it ends at 0x018508, where the NEXT
# dispatcher begins:
#     018460  323b 0006     move.w (6,PC,Dn.w),D1   <- dispatcher #1
#     018464  4efb 1002     jmp    (2,PC,D1.w)      ;  table base 0x018468
#     018468  ... 80 entries ...
#     018508  323b 0006     move.w (6,PC,D3.w),D1   <- dispatcher #2
#     01850A                ^^^^ ITS DISPLACEMENT OPERAND  <- what we wrote
#     01850C  4efb 1002     jmp    (2,PC,D1.w)      ;  table base 0x018510
# 0x018468 + 81*2 = 0x01850A runs TWO ENTRIES OFF THE END of table #1 and
# lands on dispatcher #2's displacement. Changing 0006 -> 0224 made that
# dispatcher read its jump table 0x21E bytes away — FOR EVERY CHARACTER,
# legacy included. The manifest's own words ("a displacement pointing back
# INTO the table") were the clue: it was a displacement because it IS one.
#
# MEASURED (14z-75): vanilla reads 0x01850A SIX times during
# 05_timeout_idle (frames 3190/3201/3211/3222/3233/3244, all at PC 0x018508,
# i.e. that instruction fetching its own extension word) and ZERO times
# during 02_demitri_vs_cpu — which is the replay 14z-74 used to certify the
# row "DEAD". The deadness claim was true only of the replay it was measured
# on. With this row present, 05_timeout_idle / 07_mash_storm /
# 30_demitri_throw / 01_attract_long diverge from vanilla and NEVER
# re-converge; removing this single row alone restores all four to the
# ratified select-wheel window and nothing more.
#
# CLAUDE.md §1: "A change that improves the new characters but perturbs one
# byte of legacy behavior is a failed change." Reverting is not optional.
#
# RESOLVED, same session: withdrawing this word DID reopen the crash (rig 72:
# pyron18 resets at f3650, pyron17 does not) — so the 14z-74 word genuinely
# worked, it was simply the wrong byte. The crash is now FIXED in Pyron's OWN
# DATA by the `port_patch` at the end of this file: his sub-state index 81 is
# out of range for vsavj's 80-entry dispatch table, so it is retargeted to 79
# (vs2 0x0D0C7F, region hitbox_proj), an in-range entry that already reaches
# the same handler. One byte, unreachable by legacy. See that block.
# Do NOT restore the word below — `tests/test_pyron_cosmo.sh` fails if it
# comes back.

# ══ 14z-75 THE SPRITE/HUD BLINK — ROOT-CAUSED, and it is a DEAD ROW ═══════
#
# THE DEFECT (measured, tests/test_pyron_blink.sh): palette RAM row 10
# (0x90C140) — his SPRITE's row AND his in-match HUD MUGSHOT's row, which is
# why both blink — alternated every frame between his own palette and vsavj
# palette-seq row 0x26. Native holds it constant.
#
# THE MECHANISM, from an instruction trace (GUARD_TRACE) of a frame that
# performs the write. There is a PER-CHARACTER PALETTE-ROUTINE dispatcher:
#     0x2A894  moveq #0,D1 / move.b ($382,A6),D1   <- the CHARACTER ID
#              add.w D1,D1 / move.w ($6,PC,D1.w),D1 / jmp ($2,PC,D1.w)
# with a WORD-displacement table at 0x2A8A4 indexed by id*2. Most characters
# point at the DEFAULT handler 0x2A8E4 (displacement 0x0040), which does no
# palette animation. vsavj's rows 0x10-0x1F ALIAS 0x00-0x0F, so:
#     row 0x11 (Pyron)   = 0x008E -> 0x2A932  <- row 0x01's ANIMATED handler
#                                                (moveq #$26,D0 ;
#                                                 add.b ($3AE,A6),D0 ;
#                                                 bra 0x2AD82)
#     vs2  row 0x11      = 0x0040 -> the DEFAULT handler
# So our Pyron inherited a base-half character's animated-palette routine and
# ran it every frame, while native Pyron uses the plain default. 0x2AD82 is
# the palette-seq resolver — the same one H's DARK FORCE work found, which is
# why the symptom looked like a DF recolour without Dark Force ($FF802E = 0
# on BOTH legs, measured).
#
# THE FIX is one word: make row 0x11 what vs2's row 0x11 already is.
#
# WHY IT IS LEGACY-SAFE BY CONSTRUCTION: the table is indexed by the
# character id at +0x382, and vanilla NEVER puts an id in 0x10-0x1F in either
# player struct — that is the standing invariant `tests/audit_id_writers.sh`
# exists to enforce. Row 0x11 is therefore unreachable in legacy, so this
# word is inert for every vanilla path. (Note the table is read
# PC-RELATIVELY, so any watchpoint on it must use the OPCODES space —
# docs/GOTCHAS.md.)
#
# CROSS-TENANT NOTE, NOT ACTED ON HERE: Huitzil's row 0x10 is 0x004A ->
# 0x2A8EE, i.e. row 0x00's handler, where vs2's row 0x10 is also the DEFAULT
# 0x0040. He therefore carries the same class of defect, latent — it is
# benign in effect (measured: 0 hits at 0x2AD82 on the frozen build), but it
# is not what native does. huitzil-m2 is FROZEN and maintainer-confirmed, so
# changing it is a maintainer decision, not mine. Donovan's row 0x13 is
# already 0x0040 — which is why this never surfaced on him.
[[code_word]]
stage = 6
name = "palette_routine_row_11"
addr = 0x02A8C6
old_hex = "008e"
new_hex = "0040"

# ── 14z-75 (round 2, maintainer playtest of pyron16): the blink survived on
# the SELECT screen and on the between-fight ROUTE MAP. Same defect, two
# more tables — the fix above only covered the IN-MATCH dispatcher.
#
# Found by SWEEPING the ROM for the shape instead of chasing one screen:
# every `jmp (d8,PC,Dn.w)` word table whose rows 0x10-0x1F alias 0x00-0x0F.
# Five exist; three needed nothing, and these two put Pyron on row 0x01's
# handler where vs2 has the DEFAULT:
#
#   table 0x02B650 (dispatcher 0x02B64C, `move.b ($382,A4),D0`)
#       vsavj row 0x11 = 0x0042 (alias of row 0x01) -> 0x02B692
#       vs2   row 0x11 = 0x0040 -> the default, whose body is a bare RTS
#       and 0x02B692 contains the SAME palette request as the in-match one
#       (`moveq #$26,D0 / add.b ($3AE,A4),D0`) branching to 0x02B7E8 — the
#       site our build over-called 523 times against native's 180.
#
#   table 0x073790 (dispatcher 0x07378C, `move.b ($39,A6),D0`)
#       vsavj row 0x11 = 0x0042 -> 0x0737D2 ; vs2 row 0x11 = 0x0040 (RTS)
#
# Huitzil's row 0x10 already MATCHES vs2 in both of these (0x0040 and 0x0042
# respectively), so neither touches him. Donovan's row 0x13 differs from vs2
# in both, but in the SAFE direction — ours is the no-op default where vs2
# runs his own routine, i.e. a missing feature, not a spurious one.
[[code_word]]
stage = 6
name = "palette_routine_row_11_b"
addr = 0x02B672
