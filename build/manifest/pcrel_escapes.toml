# pcrel_escapes.toml — THE FROZEN pc-relative DATA-ESCAPE INVENTORY
# (14z-94, GitHub #22).
#
# WHAT THIS IS. census_regions.py census 3 reports every `lea (d16,pc),An`
# whose target leaves its region; verify_pcrel_data.py then reads the BUILT
# image and asks whether that pointer still lands on its table. An escape
# whose table did NOT travel with the region resolves somewhere else by
# construction — so a "BROKEN" line is not automatically a defect, it is a
# pointer whose target moved out from under it.
#
# WHY THE TOOL IS NOT A PASS/FAIL GATE. Measured 14z-94 on all three shipping
# builds: 69/69, 10/10 and 10/10 escapes do not resolve. A 100% rate on
# field-confirmed builds is the signature of ACCEPTED escapes (dead paths the
# port never executes), not of 89 live defects. Wiring the tool into the
# battery as-is — which is what #22 proposed — would make it permanently red
# and therefore ignored.
#
# SO IT IS FROZEN INSTEAD, on the shared_writes doctrine: a pass means the set
# is UNCHANGED SINCE REVIEWED, not that these pointers are safe. Any addition,
# removal or change FAILS, which forces someone to establish what a new escape
# reads before it ships.
#
# THE POSITIVE CONTROL that says the tool still works: region x06cac0 — the
# one verify_pcrel_data's own docstring records as BROKEN on build/hui11 and
# fixed in 14z-69i — is absent from this inventory. The instrument
# distinguishes fixed from broken; it is the VERDICT that needed a baseline.

