# build/manifest/moves_huitzil.toml — the maintainer's move list for Huitzil
# (display name PHOBOS; the manifests call him huitzil) — character-data
# map, phase 1. Transcribed 14z-120 (2026-08-30) from the maintainer's
# list; no move name, input or property here is Claude's — the notes are
# the maintainer's words, normalised.
# Schema: build/manifest/moves_TEMPLATE.toml (flat rows, tools/_minitoml.py).
# CONVENTIONS: see the header of moves_donovan.toml (numpad inputs, ES =
# two punches / two kicks as its own row, Dark Force = P+K, guard cancel =
# 623P/K in blockstun for 1 stock). Phobos's guard cancel is Reflect Wall,
# which is a GUARD-CANCEL-ONLY special (no free 623P input, no ES —
# maintainer-corrected 2026-08-30). The six 6+button "alternate attacks"
# are six distinct command normals; Plasma Beam's ES is one move by
# either pair; Air Dash / Float are filed as movement (dash / misc).


# NAMING STEP DONE 14z-120 (2026-08-30): every seq below was MEASURED on native
# vs2 (Huitzil forced by the early-window poke) by tools/name_moves.py — see the
# Donovan file's header for the method; gate tests/test_move_naming.sh. TWO
# FINDINGS FOR THE MAINTAINER: Genocide Vulcan's input measured as 421+P (the
# list says 421+K, which never fired); Reflect Wall's guard cancel spent no
# banked stock on native vs2.

