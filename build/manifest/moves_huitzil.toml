notes = "Command throw; ground throw, must be performed up close; MP or HP; ES = Circuit Scrapper (ES); MEASURED 14z-120: a2:0x1e (throw start) -> a2:0x2d -> a2:0x2e -> a2:0x30 -> a2:0x31 when it CONNECTS (rig: a step back then 63214MP; from a pinned pushbox overlap the input came out as a special instead). A pair press with two OTHER buttons triggers the ES beam (MP+HP) or the ES launcher (LP+MP)"
