# bank_map.toml — the per-character table bank, transcribed from
# docs/game/atlas/character_tables.md (M1 consumer-site disassembly). This file is
# the single source of truth for table addresses/kinds consumed by
# tools/extract_char.py and tools/gen_donovan_patch.py.
#
# NEVER derive table addresses by scanning (docs/GOTCHAS.md: the fuzzy
# address scanner misaligns by 0x10). Addresses here are vsavj; the other
# sets are origin + (vsavj_addr - vsavj_origin) — internal deltas are
# preserved across all three sets (verified M1).
#
# kind:
#   code_ptr  long entries -> per-character 68k routines (repoint to
#             relocated+re-encrypted code, or reconciled engine routine)
#   data_ptr  long entries -> per-character data (seed for region extraction;
#             repoint to relocated copy). 'region' groups seeds.
#   value32/value16/value8  per-char VALUES (copy, never repoint)
#   rec8      8 bytes per char (two longs read together; copy)
#   byte2d    2D byte table, 'span' bytes total (0x1E per char); copy row
#   auto      gap table with no documented consumer: extractor classifies
#             from the vsav2<->vhunt2 oracle (byte-identical window = values;
#             known-shift pointer deltas = pointers) and REPORTS; unresolved
#             autos are surfaced, not silently skipped
# stride: bytes from this table's base to the next table (entry width * 32
#         unless byte2d). Entry addr for char c = base + c*stride/32 for
#         uniform kinds (byte2d uses span/32 per row).
#
# Hard validation anchors (extractor asserts these, vsav2):
#   dispatch_00[0x13] == 0x05AE20, hitbox_base[0x13] == 0x0C8DF8,
#   anim_index_a[0x13] == 0x27F548  (docs/game/atlas/character_tables.md)

[origins]
vsavj = 0x0BD0FA
vsav2 = 0x0D7298
vhunt2 = 0x0D6B2A

