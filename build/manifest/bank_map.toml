# param32_a/b are PAIR tables: 8 bytes per char = (forward.l, back.l)
# movement velocities. They were registered as value32/stride-0x80
# (4B rows), which made "slot 0x0F" hit FELICIA'S walk-back long
# (char 7 pair, second half) — her walk drifted 1px/frame-group and
# desynced the legacy 29_felicia_walljump oracle (session 14w-b).
# rec8 + stride 0x100 => entry = base + char*8, both longs ported.
[[table]]
