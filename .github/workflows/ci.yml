# CI — the ROM-free half of the suite (14z-93, GitHub #41).
#
# WHAT THIS IS NOT. It is NOT "the suite". The replay oracle — every gate
# that boots MAME or FBNeo — is MAINTAINER-RUN, because it needs commercial
# vsavj/vsav2/vhunt2 dumps that live in $ROMDIR and must never leave the
# machine (CLAUDE.md rule 7). A green badge here means the ROM-free gates
# and the static checks passed. It does not mean the oracle suite passed.
# Read that sentence before treating this as coverage.
#
# WHY IT EXISTS ANYWAY. CLAUDE.md rule 2 is "no untested change survives a
# session" and rule 6 is "failing regression halts forward work", and both
# currently depend on one maintainer remembering to run things on one macOS
# box. The verdict-logic ground-truth tests are precisely the code §4 says
# must itself be tested, and they are the cheapest thing in the repo to
# gate — seconds, no ROMs, no emulator.
#
# THE JOB MUST FAIL ON SKIP. A gate that SKIPs for want of a fixture is not
# a passing gate, and a job that counts it as one reports green forever the
# day someone renames something. Every gate below must exit 0 AND print no
# SKIP line. That rule is why the gate list lives in tests/ci_portable.txt
# rather than here: adding a gate is a one-line edit there, and the file
# documents which gates are excluded and why.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rom-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TAGS: test_freeze_tag_coverage asserts every frozen build is an
          # annotated freeze/* tag — a tagless shallow clone can only SKIP,
          # and this tier counts a SKIP as failure (14z-133b).
          fetch-depth: 0
          fetch-tags: true

      # SUBMODULES, top level only. test_harness_frame_bound reads the FBNeo
      # harness source; test_jtcores_twin, test_jtsim_scratch_heal and
      # test_sim_wram_contract read the jtcores fork. NEVER --recursive:
      # emu/jtcores carries a PRIVATE ssh submodule (modules/jtframe/target/
      # pocket) that aborts a recursive init (tools/setup_jtcores.sh). No ROM
      # is involved — both are public source repositories.
      - name: submodules the ROM-free gates read (top level, not recursive)
        run: |
          set -eu
          git submodule update --init emu/fbneo emu/jtcores
          git -C emu/jtcores submodule update --init modules/fx68k modules/jt12 modules/jt51 modules/jteeprom modules/jtdsp16

      - name: Shells present
        run: |
          set -eu
          for sh in dash bash; do command -v "$sh" >/dev/null \
            || { echo "missing $sh"; exit 1; }; done
          dash --version 2>&1 | head -1 || true
          bash --version | head -1

      # ---- static half: this is where the return is -------------------
      - name: python3 -m py_compile over every tracked .py
        run: |
          set -eu
          n=0
          for f in $(git ls-files '*.py'); do
            python3 -m py_compile "$f"; n=$((n+1))
          done
          echo "compiled $n tracked .py files"
          [ "$n" -gt 0 ] || { echo "no .py files found — the glob is wrong"; exit 1; }

      # POSIX-shell parse of every tracked .sh under BOTH shells. `dash -n`
      # is the one that matters: the harness is #!/bin/sh and the dev box's
      # /bin/sh is not dash, so a bash-ism ships undetected. A `dash -n`
      # gate would have caught the main build driver being dead on
      # Debian/Ubuntu the day it was introduced (L7-02).
      - name: dash -n and bash -n over every tracked .sh
        run: |
          set -eu
          n=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
            case "$(head -1 "$f")" in
              *bash*) : ;;              # declares bash; dash -n would be wrong
              *)      dash -n "$f" ;;
            esac
            n=$((n+1))
          done
          echo "parsed $n tracked .sh files"
          [ "$n" -gt 0 ] || { echo "no .sh files found — the glob is wrong"; exit 1; }

      # The L7-02 tripwire, as a live smoke rather than an argument: run the
      # main build driver VIA ITS OWN SHEBANG with no arguments and require
      # its own usage error, not a shell error.
      #
      # NOTE it is deliberately NOT forced under dash. build_donovan.sh
      # declares #!/bin/bash because it relies on `set -o pipefail`
      # (corrected 14z-90); running it under dash would test a claim the
      # script does not make and fails on `set: Illegal option -o pipefail`.
      # The real L7-02 guard — "a script that needs bash must SAY so in its
      # shebang", checked across every tracked .sh — is
      # tests/test_shell_portability.sh, which runs in the gate list below.
      # This step covers the other half: the driver still starts.
      - name: build_donovan.sh smoke — reaches its own usage error
        run: |
          set -eu
          out="$(tools/build_donovan.sh 2>&1 || true)"
          printf '%s\n' "$out" | head -3
          case "$out" in
            *"Illegal option"*|*"Syntax error"*|*": not found"*)
              echo "FAIL: the build driver died in the shell, not in its own argument handling"; exit 1 ;;
          esac
          case "$out" in
            *usage*|*stage*) echo "ok: reached its own usage error" ;;
            *) echo "FAIL: unexpected output from the build driver"; exit 1 ;;
          esac

      # Rule 7 tripwire (L7-03): no non-ignored file may look like ROM
      # content. Entropy is a proxy, not a proof — but a committed binary
      # blob is exactly what it catches, and rule 7 is the one rule whose
      # violation is not recoverable by a later commit.
      #
      # THRESHOLD 6.0, MEASURED, not the 3.0 the issue suggested — 3.0 would
      # flag every text file in the repo and the check would be noise.
      # Measured on this tree (bits/byte): ci_portable.txt 4.72,
      # gen_donovan_patch.py 4.76, STATE.md 5.15, a placed code blob 5.60,
      # and a DECRYPTED ROM IMAGE 6.56. 6.0 sits above everything the repo
      # legitimately holds and below ROM content, which is the separation
      # the rule actually needs.
      - name: rule-7 entropy tripwire on untracked, non-ignored files
        run: |
          set -eu
          git status --porcelain --untracked-files=all | awk '$1=="??"{print $2}' > /tmp/untracked.txt
          if [ -s /tmp/untracked.txt ]; then
            python3 - <<'PY'
          import math, sys
          bad = []
          for path in open("/tmp/untracked.txt").read().split():
              try:
                  b = open(path, "rb").read(65536)
              except OSError:
                  continue
              if len(b) < 512:
                  continue
              freq = [0]*256
              for x in b: freq[x] += 1
              h = -sum((c/len(b))*math.log2(c/len(b)) for c in freq if c)
              if h > 6.0:
                  bad.append((path, round(h, 2)))
          if bad:
              print("FAIL: high-entropy untracked files (rule 7 — no ROM content):")
              for p, h in bad: print(f"  {p}  {h} bits/byte (limit 6.0)")
              sys.exit(1)
          print("ok: no high-entropy untracked files")
          PY
          else
            echo "ok: no untracked files"
          fi

      # ---- the ROM-free gates -----------------------------------------
      # The list is tests/ci_portable.txt, which also records WHICH gates
      # are excluded and why (they need $ROMDIR, decrypted images, or build
      # directories a clean checkout does not have).
      # THE PRE-COMMIT COMMAND ITSELF, in strict mode (14z-133b). Until now this
      # step was its own loop over tests/ci_portable.txt, and it classified
      # differently from tests/run_all_static.sh in two ways the project had
      # already paid for elsewhere: it grepped a gate's WHOLE output for "SKIP",
      # so a ground-truth gate that prints a fake gate's "SKIP:" line
      # (test_emulator_runner) read as skipped; and it fed the list on stdin,
      # which a gate that reads stdin swallows (HANDOFF "close stdin"). One
      # classifier for CI and the developer's desk: without ROMDIR the runner
      # selects the portable tier only, --strict makes a SKIP fatal, and its
      # registry-coverage check names any ROM-free gate in neither list.
      - name: ROM-free ground-truth gates (tests/run_all_static.sh --tier portable --strict)
        run: |
          set -eu
          tests/run_all_static.sh --tier portable --strict </dev/null | tee /tmp/static.log
          grep -q '^GREEN' /tmp/static.log || { echo "::error::the portable tier is not GREEN"; exit 1; }
          n="$(sed -n 's/^PASS \([0-9]*\).*/\1/p' /tmp/static.log | tail -1)"
          echo "ran $n gates"
          # FLOOR: 61 registered at 14z-124 (the documentation pass's close, G7);
          # it was 15 from 14z-93. Raise it when the list grows; never lower it
          # to make a shrunken list green.
          [ "${n:-0}" -ge 60 ] || { echo "::error::only $n gates ran — the list shrank"; exit 1; }

      # Advisory, not blocking: shellcheck has never run on this repo, so
      # the first run is expected to produce findings. Blocking on it would
      # be rule 2 backwards (a hard gate ahead of an untested change).
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning $(git ls-files '*.sh') || true
